<script>
// =====================================================================
        // QUẢN LÝ HỒ SƠ CÁ NHÂN (Phase 1 - Dynamic Profile)
        // =====================================================================

        /**
         * Đọc hồ sơ từ localStorage, fallback về DEFAULT_PROFILE nếu chưa có
         * @returns {{ fullName: string, studentId: string, major: string, avatarInitials: string }}
         */
        function loadUserProfile() {
            const isLoggedOut = !currentUserEmail || localStorage.getItem('csg_logged_out') === 'true';
            if (isLoggedOut) {
                return { ...DEFAULT_PROFILE };
            }
            try {
                const raw = localStorage.getItem(STORAGE_KEY_PROFILE);
                if (raw) {
                    const parsed = JSON.parse(raw);
                    if (parsed && parsed.fullName) return parsed;
                }
            } catch (e) {
                console.error('Lỗi đọc profile:', e);
            }
            if (currentUserEmail.toLowerCase() === ADMIN_PRIMARY_EMAIL.toLowerCase()) {
                return {
                    fullName:   'Nguyễn Trọng Tài',
                    studentId:  'trtainguyen2306@gmail.com',
                    major:      'Kỹ thuật phần mềm',
                    avatarInitials: 'NT'
                };
            }
            return {
                fullName:   currentUserEmail.split('@')[0],
                studentId:  currentUserEmail,
                major:      'Sinh viên',
                avatarInitials: currentUserEmail.charAt(0).toUpperCase()
            };
        }

        /**
         * Tính chữ viết tắt Avatar từ họ tên (lấy chữ cái đầu 2 từ cuối)
         * Ví dụ: "Nguyễn Trọng Tài" → "NT"
         * @param {string} name
         * @returns {string}
         */
        function computeAvatarInitials(name) {
            if (!name || !name.trim()) return '👤';
            const parts = name.trim().split(/\s+/);
            if (parts.length === 1) return parts[0].charAt(0).toUpperCase();
            const last = parts[parts.length - 1].charAt(0).toUpperCase();
            const secondLast = parts[parts.length - 2].charAt(0).toUpperCase();
            return secondLast + last;
        }

        /**
         * Cập nhật tất cả vị trí hiển thị profile trên giao diện
         * (Avatar, tên, mã SV trong header + sidebar footer)
         */
        function renderProfileUI() {
            const isLoggedOut = (localStorage.getItem('csg_logged_out') === 'true');
            const isLoggedIn = !isLoggedOut && !!currentUserEmail && currentUserEmail.trim() !== '' && currentUserEmail.includes('@');
            const profile = loadUserProfile();
            const initials = isLoggedIn ? (profile.avatarInitials || computeAvatarInitials(profile.fullName)) : '👤';

            // Avatar trong Header
            const headerAvatar = document.getElementById('headerAvatar');
            if (headerAvatar) {
                if (isLoggedIn && profile.avatarUrl) {
                    headerAvatar.innerHTML = `<img src="${profile.avatarUrl}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
                    headerAvatar.className = 'w-8 h-8 rounded-full shadow-xs shrink-0 overflow-hidden';
                } else {
                    headerAvatar.innerText = initials;
                    if (!isLoggedIn) {
                        headerAvatar.className = 'w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-bold text-xs flex items-center justify-center shadow-xs shrink-0 transition-all';
                    } else {
                        headerAvatar.className = 'w-8 h-8 rounded-full bg-[#0054a6] text-white font-bold text-xs flex items-center justify-center shadow-xs shrink-0 transition-all';
                    }
                }
            }

            // Tên đầy đủ trong Header (chỉ hiện trên lg+)
            const headerName = document.getElementById('headerProfileName');
            if (headerName) headerName.innerText = isLoggedIn ? (profile.fullName || currentUserEmail.split('@')[0]) : 'Khách';

            // Mã sinh viên trong Header
            const headerStudentId = document.getElementById('headerStudentId');
            if (headerStudentId) headerStudentId.innerText = isLoggedIn ? (profile.studentId || currentUserEmail) : 'Bấm để đăng nhập';

            // Cập nhật Avatar và thông tin trong Dropdown Menu của Header
            const dropAvatar = document.getElementById('dropdownAvatar');
            if (dropAvatar) {
                if (isLoggedIn && profile.avatarUrl) {
                    dropAvatar.innerHTML = `<img src="${profile.avatarUrl}" alt="Avatar" class="w-full h-full rounded-full object-cover">`;
                    dropAvatar.className = 'w-10 h-10 rounded-full shadow-xs shrink-0 overflow-hidden';
                } else {
                    dropAvatar.innerText = initials;
                    dropAvatar.className = isLoggedIn 
                        ? 'w-10 h-10 rounded-full bg-[#0054a6] text-white font-black text-sm flex items-center justify-center shadow-xs shrink-0' 
                        : 'w-10 h-10 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300 font-black text-sm flex items-center justify-center shadow-xs shrink-0';
                }
            }

            const dropName = document.getElementById('dropdownProfileName');
            if (dropName) dropName.innerText = isLoggedIn ? (profile.fullName || currentUserEmail.split('@')[0]) : 'Khách vãng lai';

            const dropEmail = document.getElementById('dropdownEmail');
            if (dropEmail) dropEmail.innerText = isLoggedIn ? currentUserEmail : 'Chưa kết nối tài khoản Google';

            const dropRole = document.getElementById('dropdownRoleBadge');
            if (dropRole) {
                dropRole.innerText = isLoggedIn ? (isCurrentUserAdmin ? 'Admin' : 'Sinh viên') : 'Khách';
                dropRole.className = isLoggedIn 
                    ? (isCurrentUserAdmin ? 'text-[9px] font-black px-1.5 py-0.5 rounded bg-purple-100 text-purple-700 dark:bg-purple-950 dark:text-purple-300 shrink-0' : 'text-[9px] font-black px-1.5 py-0.5 rounded bg-blue-100 text-[#0054a6] dark:bg-blue-950 dark:text-blue-300 shrink-0')
                    : 'text-[9px] font-bold px-1.5 py-0.5 rounded bg-slate-200 text-slate-600 dark:bg-slate-700 dark:text-slate-300 shrink-0';
            }

            // Nút hành động trong Dropdown: Đăng nhập vs Đăng xuất
            const dropActionContainer = document.getElementById('dropdownAuthActionContainer');
            if (dropActionContainer) {
                if (isLoggedIn) {
                    dropActionContainer.innerHTML = `
                        <button type="button" onclick="closeProfileDropdown(); logoutUser();" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-xl text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/40 transition-colors text-left text-xs font-semibold cursor-pointer">
                            <span class="text-sm">🚪</span>
                            <span>Đăng xuất tài khoản</span>
                        </button>
                    `;
                } else {
                    dropActionContainer.innerHTML = `
                        <button type="button" onclick="closeProfileDropdown(); openAuthModal();" class="w-full flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl bg-[#0054a6] hover:bg-[#004285] text-white transition-colors text-xs font-bold shadow-xs cursor-pointer">
                            <svg class="w-3.5 h-3.5 bg-white rounded-full p-0.5 shrink-0" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                            </svg>
                            <span>Đăng nhập bằng Google</span>
                        </button>
                    `;
                }
            }

            // Avatar trong Modal Google Auth
            const authModalAvatar = document.getElementById('authModalAvatar');
            if (authModalAvatar) authModalAvatar.innerText = initials;

            // Avatar lớn trong Modal Profile
            const modalAvatar = document.getElementById('modalProfileAvatar');
            if (modalAvatar) modalAvatar.innerText = initials;

            // Tên + mã trong Modal info box
            const modalName = document.getElementById('modalProfileName');
            if (modalName) modalName.innerText = isLoggedIn ? (profile.fullName || currentUserEmail.split('@')[0]) : 'Khách';

            const modalId = document.getElementById('modalProfileStudentId');
            if (modalId) modalId.innerText = isLoggedIn ? (profile.studentId || currentUserEmail) : 'Chưa đăng nhập';

            const modalMajor = document.getElementById('modalProfileMajor');
            if (modalMajor) modalMajor.innerText = isLoggedIn ? (profile.major || 'Sinh viên') : '';
        }

        // Tải câu mục tiêu / động lực vào Box đặc biệt trên Header
        function loadUserMotto() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY_MOTTO);
                const motto = (saved && saved.trim()) ? saved.trim() : DEFAULT_MOTTO;
                const displayEl = document.getElementById('mottoDisplayText');
                if (displayEl) {
                    displayEl.innerText = motto;
                    displayEl.title = motto;
                }
                const inputEl = document.getElementById('mottoInput');
                if (inputEl) {
                    inputEl.value = motto;
                }
            } catch (e) {
                console.error('Lỗi tải câu mục tiêu:', e);
            }
        }

        // Mở Modal Hồ sơ cá nhân và điền dữ liệu vào form
        function openProfileModal() {
            const profile = loadUserProfile();

            // Điền dữ liệu hiện tại vào form
            const nameInput   = document.getElementById('profileNameInput');
            const idInput     = document.getElementById('profileStudentIdInput');
            const majorInput  = document.getElementById('profileMajorInput');
            if (nameInput)  nameInput.value  = profile.fullName  || '';
            if (idInput)    idInput.value    = profile.studentId || '';
            if (majorInput) majorInput.value = profile.major     || '';

            loadUserMotto();
            const modal = document.getElementById('profileModal');
            if (modal) {
                modal.classList.remove('hidden');
                setTimeout(() => {
                    if (nameInput) { nameInput.focus(); nameInput.select(); }
                }, 80);
            }
        }

        // Đóng Modal Hồ sơ cá nhân
        function closeProfileModal() {
            const modal = document.getElementById('profileModal');
            if (modal) modal.classList.add('hidden');
        }

        /**
         * Lưu toàn bộ hồ sơ cá nhân (tên, mã SV, chuyên ngành) + motto vào localStorage
         * Sau đó cập nhật giao diện ngay lập tức — không cần reload
         */
        function saveProfile() {
            const nameInput   = document.getElementById('profileNameInput');
            const idInput     = document.getElementById('profileStudentIdInput');
            const majorInput  = document.getElementById('profileMajorInput');
            const mottoInput  = document.getElementById('mottoInput');

            const fullName  = nameInput   ? nameInput.value.trim()   : '';
            const studentId = idInput     ? idInput.value.trim()     : '';
            const major     = majorInput  ? majorInput.value.trim()  : '';

            // Validation đơn giản
            if (!fullName) {
                showToast('Vui lòng nhập họ và tên!', '⚠️');
                if (nameInput) nameInput.focus();
                return;
            }

            const profile = {
                fullName:        fullName   || DEFAULT_PROFILE.fullName,
                studentId:       studentId  || DEFAULT_PROFILE.studentId,
                major:           major      || DEFAULT_PROFILE.major,
                avatarInitials:  computeAvatarInitials(fullName || DEFAULT_PROFILE.fullName)
            };

            try {
                localStorage.setItem(STORAGE_KEY_PROFILE, JSON.stringify(profile));
            } catch (e) {
                console.error('Lỗi lưu profile:', e);
            }

            // Lưu motto
            const newMotto = mottoInput ? mottoInput.value.trim() : '';
            const finalMotto = newMotto || DEFAULT_MOTTO;
            try {
                localStorage.setItem(STORAGE_KEY_MOTTO, finalMotto);
            } catch (e) {
                console.error('Lỗi lưu câu mục tiêu:', e);
            }

            // Cập nhật giao diện ngay lập tức
            renderProfileUI();
            const displayEl = document.getElementById('mottoDisplayText');
            if (displayEl) { displayEl.innerText = finalMotto; displayEl.title = finalMotto; }

            closeProfileModal();
            showToast('Đã cập nhật hồ sơ cá nhân thành công!', '✅');
        }

        // Giữ lại hàm saveMotto để không phá các chỗ khác gọi nó
        function saveMotto() { saveProfile(); }



        // =====================================================================
        // QUẢN LÝ TÀI KHOẢN, PHÂN QUYỀN & TIẾP NHẬN PHẢN HỒI (PHASE 4)
        // =====================================================================
        async function initUserAuth() {
            const isLoggedOut = (localStorage.getItem('csg_logged_out') === 'true');
            const authGate = document.getElementById('authGateModal');

            // Khởi tạo Google Identity Services trực tiếp trên concavachencom.site
            if (typeof initGoogleIdentityServices === 'function') {
                initGoogleIdentityServices();
                if (typeof initGoogleTokenClient === 'function') initGoogleTokenClient();
                setTimeout(() => {
                    initGoogleIdentityServices();
                    if (typeof initGoogleTokenClient === 'function') initGoogleTokenClient();
                }, 800);
            }

            // 1. Kiểm tra xem URL có chứa token/code hoặc lỗi từ OAuth không
            const url = new URL(window.location.href);
            const oauthCode = url.searchParams.get('code');
            const hasHashToken = window.location.hash && (window.location.hash.includes('access_token') || window.location.hash.includes('refresh_token'));
            const oauthError = url.searchParams.get('error_description') || url.searchParams.get('error') || (window.location.hash.includes('error=') ? 'OAuth Failure' : null);

            if (oauthError) {
                console.error('Lỗi OAuth từ nhà cung cấp:', oauthError);
                // Dọn sạch URL ngay lập tức để không hiện chuỗi lỗi trên thanh địa chỉ
                window.history.replaceState({}, document.title, window.location.pathname);
                showToast('Lỗi xác thực Google OAuth. Đang chuyển sang chế độ đăng nhập trực tiếp.', '⚠️');
            }

            // 2. Xử lý Supabase Client (cho concavachencom.site & PWA)
            if (window.supabaseClient) {
                try {
                    // Lắng nghe sự kiện đăng nhập / đăng xuất
                    window.supabaseClient.auth.onAuthStateChange(async (event, session) => {
                        console.log('Supabase Auth Event:', event, session?.user?.email);
                        if (session && session.user) {
                            applyAuthenticatedSession(session.user);
                        } else if (event === 'SIGNED_OUT') {
                            applyUnauthenticatedState();
                        }
                    });

                    // Nếu có OAuth code trong URL (PKCE Flow)
                    if (oauthCode) {
                        console.log('🔄 Đang xác thực mã OAuth Code...');
                        const { data, error } = await window.supabaseClient.auth.exchangeCodeForSession(oauthCode);
                        if (!error && data?.session?.user) {
                            console.log('✅ Xác thực mã OAuth thành công:', data.session.user.email);
                            window.history.replaceState({}, document.title, window.location.pathname);
                            applyAuthenticatedSession(data.session.user);
                            return;
                        } else if (error) {
                            console.warn('Lỗi exchangeCodeForSession:', error);
                        }
                    }

                    // Nếu có Access Token trong URL Hash (Implicit Flow)
                    if (hasHashToken) {
                        console.log('🔄 Đang nhận diện Access Token từ URL Hash...');
                        const { data: { session }, error } = await window.supabaseClient.auth.getSession();
                        if (!error && session && session.user) {
                            console.log('✅ Nhận diện Session từ Hash thành công:', session.user.email);
                            window.history.replaceState({}, document.title, window.location.pathname);
                            applyAuthenticatedSession(session.user);
                            return;
                        }
                    }

                    // Kiểm tra session hiện có trong localStorage
                    const { data: { session } } = await window.supabaseClient.auth.getSession();
                    if (session && session.user && !isLoggedOut) {
                        applyAuthenticatedSession(session.user);
                        return;
                    }
                } catch (e) {
                    console.warn('Lỗi kiểm tra session Supabase:', e);
                }
            }

            // 3. Chế độ Fallback: Google Apps Script Web App hoặc Local Storage
            if (isLoggedOut) {
                applyUnauthenticatedState();
                return;
            }

            currentUserEmail = localStorage.getItem(STORAGE_KEY_CURRENT_USER) || SERVER_USER_EMAIL || '';

            if (currentUserEmail && currentUserEmail.includes('@')) {
                if (authGate) {
                    authGate.style.display = 'none';
                    authGate.classList.add('hidden');
                }
                isCurrentUserAdmin = (SERVER_IS_ADMIN || currentUserEmail.toLowerCase() === ADMIN_PRIMARY_EMAIL.toLowerCase());
                currentFeedbackBadgeCount = isCurrentUserAdmin ? (SERVER_NEW_FEEDBACK_COUNT || 0) : 0;
                renderAuthUI();
                renderProfileUI();

                if (window.google && google.script && google.script.run) {
                    google.script.run
                        .withSuccessHandler(userData => {
                            if (userData && userData.email) {
                                currentUserEmail = userData.email;
                                localStorage.setItem(STORAGE_KEY_CURRENT_USER, currentUserEmail);
                                isCurrentUserAdmin = (userData.isAdmin || currentUserEmail.toLowerCase() === ADMIN_PRIMARY_EMAIL.toLowerCase());
                                currentFeedbackBadgeCount = userData.newFeedbackCount || 0;
                                renderAuthUI();
                                renderProfileUI();
                            }
                        })
                        .withFailureHandler(err => console.warn('Lỗi đồng bộ thông tin tài khoản:', err))
                        .getCurrentUser(currentUserEmail);
                }

                if (window.supabaseClient) {
                    fetchTasksFromSupabase(currentUserEmail);
                    initSupabaseRealtime(currentUserEmail);
                }
            } else {
                applyUnauthenticatedState();
            }
        }

        function applyAuthenticatedSession(user) {
            if (!user || !user.email) return;
            currentUserEmail = user.email.toLowerCase().trim();
            localStorage.setItem(STORAGE_KEY_CURRENT_USER, currentUserEmail);
            localStorage.removeItem('csg_logged_out');

            const meta = user.user_metadata || {};
            const fullName = meta.full_name || meta.name || currentUserEmail.split('@')[0];
            const avatarUrl = meta.avatar_url || meta.picture || '';

            const profile = {
                fullName: fullName,
                studentId: currentUserEmail,
                major: 'Sinh viên',
                avatarInitials: computeAvatarInitials(fullName),
                avatarUrl: avatarUrl
            };
            try {
                localStorage.setItem(STORAGE_KEY_PROFILE, JSON.stringify(profile));
            } catch(e) {}

            isCurrentUserAdmin = (currentUserEmail.toLowerCase() === ADMIN_PRIMARY_EMAIL.toLowerCase());
            currentFeedbackBadgeCount = 0;

            const authGate = document.getElementById('authGateModal');
            if (authGate) {
                authGate.style.display = 'none';
                authGate.classList.add('hidden');
            }

            renderAuthUI();
            renderProfileUI();

            fetchTasksFromSupabase(currentUserEmail);
            initSupabaseRealtime(currentUserEmail);
        }

        function applyUnauthenticatedState() {
            currentUserEmail = '';
            isCurrentUserAdmin = false;
            currentFeedbackBadgeCount = 0;
            allTasksList = [];

            const authGate = document.getElementById('authGateModal');
            if (authGate) {
                authGate.style.display = 'flex';
                authGate.classList.remove('hidden');
            }

            renderAuthUI();
            renderProfileUI();
            renderTasks([]);
        }

        async function fetchTasksFromSupabase(userEmail) {
            if (!window.supabaseClient || !userEmail) return;
            try {
                const { data, error } = await window.supabaseClient
                    .from('tasks')
                    .select('*')
                    .eq('owner_email', userEmail)
                    .order('created_at', { ascending: false });

                if (error) {
                    console.warn('Lỗi lấy tasks từ Supabase:', error);
                    return;
                }

                if (Array.isArray(data)) {
                    allTasksList = data.map(r => ({
                        id: r.id,
                        task: r.task,
                        quadrant: r.quadrant || 'inbox',
                        category: normalizeCategory(r.category, r.task, !!r.is_fap),
                        done: !!r.done,
                        day: (r.day !== null && r.day !== undefined && r.day !== '') ? String(r.day) : '',
                        deadline: r.deadline || '',
                        priority: r.priority || 'medium',
                        time: r.time || '',
                        duration: r.duration || 30,
                        subtasks: Array.isArray(r.subtasks) ? r.subtasks : (typeof r.subtasks === 'string' ? JSON.parse(r.subtasks || '[]') : []),
                        is_fap: !!r.is_fap,
                        ownerEmail: r.owner_email
                    }));

                    try {
                        localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(allTasksList));
                    } catch(e) {}

                    renderTasks(allTasksList);
                    if (typeof renderDashboard === 'function') renderDashboard();
                    if (typeof renderFapScheduleTable === 'function') renderFapScheduleTable();
                    if (typeof renderFreeTimeSchedule === 'function') renderFreeTimeSchedule();
                }
            } catch(e) {
                console.warn('Lỗi truy vấn tasks:', e);
            }
        }

        function initSupabaseRealtime(userEmail) {
            if (!window.supabaseClient || !userEmail) return;
            try {
                if (window._supabaseTasksChannel) {
                    window.supabaseClient.removeChannel(window._supabaseTasksChannel);
                }

                window._supabaseTasksChannel = window.supabaseClient
                    .channel('realtime_tasks_' + userEmail.replace(/[^a-zA-Z0-9]/g, '_'))
                    .on('postgres_changes', {
                        event: '*',
                        schema: 'public',
                        table: 'tasks',
                        filter: `owner_email=eq.${userEmail}`
                    }, (payload) => {
                        handleRealtimeTaskEvent(payload);
                    })
                    .subscribe();
            } catch(e) {
                console.warn('Lỗi khởi tạo Realtime:', e);
            }
        }

        function handleRealtimeTaskEvent(payload) {
            if (!payload || !payload.eventType) return;
            const eventType = payload.eventType;
            const newRow = payload.new;
            const oldRow = payload.old;

            if (eventType === 'INSERT' && newRow) {
                const existingIdx = allTasksList.findIndex(t => String(t.id) === String(newRow.id));
                const mapped = {
                    id: newRow.id,
                    task: newRow.task,
                    quadrant: newRow.quadrant || 'inbox',
                    category: normalizeCategory(newRow.category, newRow.task, !!newRow.is_fap),
                    done: !!newRow.done,
                    day: (newRow.day !== null && newRow.day !== undefined && newRow.day !== '') ? String(newRow.day) : '',
                    deadline: newRow.deadline || '',
                    priority: newRow.priority || 'medium',
                    time: newRow.time || '',
                    duration: newRow.duration || 30,
                    subtasks: Array.isArray(newRow.subtasks) ? newRow.subtasks : (typeof newRow.subtasks === 'string' ? JSON.parse(newRow.subtasks || '[]') : []),
                    is_fap: !!newRow.is_fap,
                    ownerEmail: newRow.owner_email
                };
                if (existingIdx >= 0) {
                    allTasksList[existingIdx] = mapped;
                } else {
                    allTasksList.unshift(mapped);
                }
            } else if (eventType === 'UPDATE' && newRow) {
                const existingIdx = allTasksList.findIndex(t => String(t.id) === String(newRow.id));
                if (existingIdx >= 0) {
                    allTasksList[existingIdx] = {
                        ...allTasksList[existingIdx],
                        task: newRow.task,
                        quadrant: newRow.quadrant || allTasksList[existingIdx].quadrant,
                        category: newRow.category || allTasksList[existingIdx].category,
                        done: !!newRow.done,
                        day: (newRow.day !== null && newRow.day !== undefined && newRow.day !== '') ? String(newRow.day) : '',
                        deadline: newRow.deadline || '',
                        priority: newRow.priority || allTasksList[existingIdx].priority,
                        time: newRow.time || '',
                        duration: newRow.duration || allTasksList[existingIdx].duration,
                        subtasks: Array.isArray(newRow.subtasks) ? newRow.subtasks : (typeof newRow.subtasks === 'string' ? JSON.parse(newRow.subtasks || '[]') : [])
                    };
                }
            } else if (eventType === 'DELETE' && oldRow) {
                allTasksList = allTasksList.filter(t => String(t.id) !== String(oldRow.id));
            }

            try {
                localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(allTasksList));
            } catch(e) {}

            renderTasks(allTasksList);
            if (typeof renderDashboard === 'function') renderDashboard();
            if (typeof renderFapScheduleTable === 'function') renderFapScheduleTable();
            if (typeof renderFreeTimeSchedule === 'function') renderFreeTimeSchedule();
        }


        function renderAuthUI() {

                } else {

            const dropdownAuthLabel = document.getElementById('dropdownAuthLabel');

            const fbDisplay = document.getElementById('feedbackUserEmailDisplay');

            const badge = document.getElementById('adminFeedbackBadge');

        function handleFeedbackSubmit(event) {
            if (event) event.preventDefault();
            const categoryEl = document.getElementById('feedbackCategoryInput');
            const contentEl = document.getElementById('feedbackContentInput');
            const submitBtn = document.getElementById('feedbackSubmitBtn');

            const category = categoryEl ? categoryEl.value : 'Góp ý tính năng';

            if (!content) {
                showToast('Vui lòng nhập nội dung góp ý!', '⚠️');
                return;
            }

            if (submitBtn) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<span>Đang gửi...</span>`;
            }

            const feedbackData = {
                category: category,
                content: content,
                userEmail: currentUserEmail
            };

            if (window.google && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(res => {

                            submitBtn.disabled = false;
                            submitBtn.innerHTML = `<span>Gửi phản hồi</span><span>🚀</span>`;
                        }
                        closeFeedbackModal();
                        showToast(res.message || 'Cảm ơn bạn! Góp ý đã gửi đến Admin thành công.', '💌');

                        }
                        showToast('Lỗi gửi góp ý: ' + err, '❌');

                if (submitBtn) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>Gửi phản hồi</span><span>🚀</span>`;

                closeFeedbackModal();

        /**
         * Khởi tạo Google Identity Services (GIS - Sign in with Google trực tiếp trên concavachencom.site)
         * Giúp đăng nhập bằng Pop-up Google hiển thị trực tiếp domain concavachencom.site
         */
        function initGoogleIdentityServices() {
            if (window.google && google.accounts && google.accounts.id && window.GOOGLE_CLIENT_ID) {
                try {
                    google.accounts.id.initialize({
                        client_id: window.GOOGLE_CLIENT_ID,
                        callback: handleGoogleCredentialResponse,
                        auto_select: false,
                        cancel_on_tap_outside: true,
                        itp_support: true
                    });

                    // Render nút Google chính hãng chuẩn Google Design
                    const btnContainer = document.getElementById('googleSignInBtnBox');
                    if (btnContainer && !btnContainer.hasChildNodes()) {
                        google.accounts.id.renderButton(btnContainer, {
                            theme: 'outline',
                            size: 'large',
                            type: 'standard',
                            shape: 'rectangular',
                            text: 'signin_with',
                            width: 320,
                            logo_alignment: 'left'
                        });
                        // Ẩn nút custom khi nút chính hãng Google đã được vẽ thành công
                        const customBtn = document.getElementById('btnAuthGateSignIn');
                        if (customBtn) customBtn.classList.add('hidden');
                    }
                } catch(e) {
                    console.warn('Lỗi initGoogleIdentityServices:', e);
                }
            }
        }

        /**
         * Tiếp nhận Google JWT ID Token từ Google Identity Services
         * Gửi ID Token vào Supabase qua signInWithIdToken
         */
        async function handleGoogleCredentialResponse(response) {
            console.log('Nhận được Google Credential Token:', response);
            if (!response || !response.credential) return;

            const idToken = response.credential;
            const gateBtn = document.getElementById('btnAuthGateSignIn');
            if (gateBtn) {
                gateBtn.disabled = true;
                gateBtn.innerHTML = `<span class="animate-spin inline-block">🔄</span><span>Đang đăng nhập Con Cá và Chén Cơm...</span>`;
            }

            if (window.supabaseClient) {
                try {
                    const { data, error } = await window.supabaseClient.auth.signInWithIdToken({
                        provider: 'google',
                        token: idToken
                    });

                    if (error) {
                        console.warn('Supabase signInWithIdToken error, fallback sang giải mã token:', error);
                        decodeAndApplyGoogleToken(idToken);
                        return;
                    }

                    if (data && data.session && data.session.user) {
                        applyAuthenticatedSession(data.session.user);
                        return;
                    }
                } catch (e) {
                    console.error('Lỗi khi gọi signInWithIdToken:', e);
                }
            }

            decodeAndApplyGoogleToken(idToken);
        }

        function decodeAndApplyGoogleToken(idToken) {
            try {
                const parts = idToken.split('.');
                if (parts.length === 3) {
                    const payload = JSON.parse(atob(parts[1].replace(/-/g, '+').replace(/_/g, '/')));
                    if (payload && payload.email) {
                        const userObj = {
                            email: payload.email,
                            user_metadata: {
                                full_name: payload.name || payload.given_name || payload.email.split('@')[0],
                                avatar_url: payload.picture || '',
                                picture: payload.picture || ''
                            }
                        };
                        applyAuthenticatedSession(userObj);
                    }
                }
            } catch(e) {
                console.warn('Lỗi giải mã token Google:', e);
            }
        }

        window.onGoogleGsiLoaded = function() {
            console.log('Google Identity Services SDK loaded.');
            initGoogleIdentityServices();
            initGoogleTokenClient();
        };

        let googleTokenClient = null;

        function initGoogleTokenClient() {
            if (window.google && google.accounts && google.accounts.oauth2 && window.GOOGLE_CLIENT_ID) {
                try {
                    googleTokenClient = google.accounts.oauth2.initTokenClient({
                        client_id: window.GOOGLE_CLIENT_ID,
                        scope: 'email profile openid',
                        callback: async (tokenResponse) => {
                            if (tokenResponse && tokenResponse.access_token) {
                                await handleGoogleAccessToken(tokenResponse.access_token);
                            } else if (tokenResponse && tokenResponse.error) {
                                console.warn('Google Token Client error:', tokenResponse.error);
                                showToast('Đăng nhập Google bị hủy hoặc gặp lỗi: ' + tokenResponse.error, '⚠️');
                                resetAuthGateBtn();
                            }
                        },
                        error_callback: (error) => {
                            console.error('Google Token Client error_callback:', error);
                            showToast('Lỗi cấu hình: Vui lòng thêm https://concavachencom.site vào Authorized JavaScript origins trên Google Cloud Console.', '❌');
                            resetAuthGateBtn();
                        }
                    });
                } catch(e) {
                    console.warn('Lỗi initGoogleTokenClient:', e);
                }
            }
        }

        async function handleGoogleAccessToken(accessToken) {
            const gateBtn = document.getElementById('btnAuthGateSignIn');
            if (gateBtn) {
                gateBtn.disabled = true;
                gateBtn.innerHTML = `<span class="animate-spin inline-block">🔄</span><span>Đang đồng bộ tài khoản...</span>`;
            }

            try {
                const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                    headers: { 'Authorization': `Bearer ${accessToken}` }
                });
                const googleUser = await res.json();
                console.log('Google User Info thành công:', googleUser);

                if (googleUser && googleUser.email) {
                    const userObj = {
                        email: googleUser.email.toLowerCase().trim(),
                        user_metadata: {
                            full_name: googleUser.name || googleUser.email.split('@')[0],
                            avatar_url: googleUser.picture || '',
                            picture: googleUser.picture || ''
                        }
                    };

                    applyAuthenticatedSession(userObj);

                    // Đồng bộ thông tin người dùng vào bảng users trên Supabase
                    if (window.supabaseClient) {
                        window.supabaseClient.from('users').upsert({
                            email: userObj.email,
                            full_name: userObj.user_metadata.full_name,
                            avatar_url: userObj.user_metadata.avatar_url,
                            last_sign_in_at: new Date().toISOString()
                        }, { onConflict: 'email' }).then(() => {}).catch(err => console.warn('Supabase users upsert:', err));
                    }
                    return;
                }
            } catch(e) {
                console.error('Lỗi lấy thông tin Google User Info:', e);
                showToast('Lỗi lấy thông tin Google: ' + e.message, '❌');
            }
            resetAuthGateBtn();
        }

        function resetAuthGateBtn() {
            const gateBtn = document.getElementById('btnAuthGateSignIn');
            if (gateBtn) {
                gateBtn.disabled = false;
                gateBtn.innerHTML = `
                    <svg class="w-5 h-5 shrink-0" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Tiếp tục với Google</span>
                `;
            }
        }

        async function handleGoogleSignIn() {
            localStorage.removeItem('csg_logged_out');

            const gateBtn = document.getElementById('btnAuthGateSignIn');
            if (gateBtn) {
                gateBtn.disabled = true;
                gateBtn.innerHTML = `<span class="animate-spin inline-block">🔄</span><span>Đang mở Google...</span>`;
            }

            // 1. Ưu tiên số 1: Google Token Client (Pop-up đăng nhập trực tiếp trên concavachencom.site)
            if (window.google && google.accounts && google.accounts.oauth2) {
                if (!googleTokenClient) {
                    initGoogleTokenClient();
                }
                if (googleTokenClient) {
                    googleTokenClient.requestAccessToken({ prompt: 'select_account' });
                    return;
                }
            }

            // 2. Fallback: Nếu Token Client chưa sẵn sàng, gọi One Tap Prompt
            if (window.google && google.accounts && google.accounts.id && window.GOOGLE_CLIENT_ID) {
                try {
                    initGoogleIdentityServices();
                    google.accounts.id.prompt((notification) => {
                        if (notification.isNotDisplayed() || notification.isSkippedMoment()) {
                            fallbackSupabaseOAuth();
                        }
                    });
                    return;
                } catch (e) {
                    console.warn('Lỗi gọi google.accounts.id.prompt:', e);
                }
            }

            // 3. Fallback cuối: Chuyển hướng Supabase OAuth
            fallbackSupabaseOAuth();
        }

        async function fallbackSupabaseOAuth() {
            const gateBtn = document.getElementById('btnAuthGateSignIn');
            if (window.supabaseClient) {
                try {
                    const redirectUrl = window.location.origin;
                    const { data, error } = await window.supabaseClient.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: redirectUrl,
                            queryParams: {
                                access_type: 'offline',
                                prompt: 'select_account'
                            }
                        }
                    });
                    if (error) {
                        console.error('Lỗi Supabase OAuth:', error);
                        showToast('Lỗi đăng nhập Google: ' + error.message, '❌');
                        resetAuthGateBtn();
                        return;
                    }
                    if (data && data.url) {
                        window.location.href = data.url;
                        return;
                    }
                    return;
                } catch (e) {
                    console.warn('Lỗi kết nối OAuth Supabase:', e);
                }
            }

            // 4. Chế độ Fallback Google Apps Script
            const targetUrl = 'https://accounts.google.com/AccountChooser?continue=' + encodeURIComponent(WEB_APP_URL);
            try {
                if (window.top && window.top !== window.self) {
                    window.top.location.href = targetUrl;
                    return;
                }
            } catch (e) {}
            window.location.href = targetUrl;
        }

        function switchUserAccountTo(newEmail) {
            localStorage.removeItem('csg_logged_out');
            currentUserEmail = newEmail.toLowerCase().trim();
            localStorage.setItem(STORAGE_KEY_CURRENT_USER, currentUserEmail);
            isCurrentUserAdmin = (currentUserEmail === ADMIN_PRIMARY_EMAIL.toLowerCase());

            closeAuthModal();
            closeProfileDropdown();
            renderProfileUI();
            renderAuthUI();
            showToast(`Chào mừng bạn quay trở lại, ${currentUserEmail}!`, '🎉');

            // Tải lại dữ liệu công việc của tài khoản này từ Google Sheets hoặc Supabase
            if (window.supabaseClient) {
                fetchTasksFromSupabase(currentUserEmail);
                initSupabaseRealtime(currentUserEmail);
            } else if (window.google && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(tasks => {
                        allTasksList = tasks || [];
                        localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(allTasksList));
                        renderTasks(allTasksList);
                        if (activeView === 'dashboard') renderDashboard();
                        else if (activeView === 'matrix') renderFapScheduleTable();
                        else if (activeView === 'freetime') renderFreeTimeSchedule();
                    })
                    .withFailureHandler(err => {
                        console.warn('Lỗi lấy task cho ' + currentUserEmail, err);
                    })
                    .getTasks(currentUserEmail);

                google.script.run
                    .withSuccessHandler(userData => {
                        if (userData && userData.email) {
                            isCurrentUserAdmin = (userData.isAdmin || currentUserEmail.toLowerCase() === ADMIN_PRIMARY_EMAIL.toLowerCase());
                            currentFeedbackBadgeCount = userData.newFeedbackCount || 0;
                            renderAuthUI();
                            renderProfileUI();
                        }
                    })
                    .getCurrentUser(currentUserEmail);
            }
        }

        async function logoutUser() {
            if (confirm(`Bạn có chắc chắn muốn đăng xuất tài khoản? Dữ liệu công việc trên Đám mây & Google Sheets vẫn được lưu an toàn 100%.`)) {
                // 1. Xoá sạch bộ nhớ tạm trên web
                localStorage.setItem('csg_logged_out', 'true');
                localStorage.removeItem(STORAGE_KEY_CURRENT_USER);
                localStorage.removeItem(STORAGE_KEY_TASKS);
                localStorage.removeItem(STORAGE_KEY_PROFILE);
                localStorage.removeItem(STORAGE_KEY_DRAFT);
                localStorage.removeItem(STORAGE_KEY_VIEW);
                localStorage.removeItem('csg_admin_filter');
                localStorage.removeItem('csg_cached_fap');
                sessionStorage.clear();

                // 2. Đăng xuất khỏi Supabase nếu có
                if (window.supabaseClient) {
                    try {
                        if (window._supabaseTasksChannel) {
                            window.supabaseClient.removeChannel(window._supabaseTasksChannel);
                            window._supabaseTasksChannel = null;
                        }
                        await window.supabaseClient.auth.signOut();
                    } catch(e) {
                        console.warn('Supabase signOut error:', e);
                    }
                }

                // 3. Làm sạch biến trong bộ nhớ RAM
                currentUserEmail = '';
                isCurrentUserAdmin = false;
                allTasksList = [];

                // 4. Reset Google GIS auto select để lần sau luôn hiện màn hình chọn tài khoản / Đăng nhập Google
                if (window.google && google.accounts && google.accounts.id) {
                    try {
                        google.accounts.id.disableAutoSelect();
                    } catch(e) {}
                }

                // 5. Cập nhật ngay toàn bộ giao diện sang trạng thái Khách sạch sẽ (0ms delay)
                closeAuthModal();
                closeProfileDropdown();
                renderProfileUI();
                renderAuthUI();
                renderTasks([]);
                if (activeView === 'dashboard') renderDashboard();
                else if (activeView === 'matrix') renderFapScheduleTable();
                else if (activeView === 'freetime') renderFreeTimeSchedule();

                const authGate = document.getElementById('authGateModal');
                if (authGate) authGate.classList.remove('hidden');

                showToast('Đã đăng xuất tài khoản. Đang ở chế độ Khách.', '👋');

                // 6. Điều hướng về URL chuẩn không chứa query/hash thừa
                if (window.location.hostname.includes('concavachencom.site')) {
                    if (window.location.pathname !== '/' || window.location.search || window.location.hash) {
                        window.location.href = 'https://concavachencom.site';
                    }
                }
            }
        }
