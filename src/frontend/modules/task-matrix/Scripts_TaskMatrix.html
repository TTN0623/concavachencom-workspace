<script>
// =====================================================================
        // TIỆN ÍCH BÓC TÁCH THÔNG TIN CÔNG VIỆC / LỊCH HỌC (SINGLE RESPONSIBILITY)
        // Loại bỏ thời gian và giảng viên trùng lặp khỏi tiêu đề chính
        // =====================================================================
        function parseTaskDetails(rawTaskText, fallbackTime = '') {
            if (!rawTaskText || typeof rawTaskText !== 'string') {
                return { cleanTitle: '', time: fallbackTime || '', room: '', lecturer: '', duration: 0, hasMeta: false };
            }
            let text = rawTaskText.trim();
            let extractedTime = fallbackTime || '';
            let extractedRoom = '';
            let extractedLecturer = '';
            let extractedDuration = 0;

            // 1. Trích xuất thời gian trong ngoặc: (07:00 - 09:15) hoặc (7:00 – 9:15)
            const timeRegex = /\((\d{1,2}:\d{2}\s*[-–—]\s*\d{1,2}:\d{2})\)/;
            const timeMatch = text.match(timeRegex);
            if (timeMatch) {
                if (!extractedTime) extractedTime = timeMatch[1].replace(/\s+/g, ' ');
                text = text.replace(timeRegex, '').trim();
            }

            // 2. Trích xuất phòng học: P.xxx hoặc Phòng xxx
            const roomRegex = /[-–—]?\s*(?:P\.|Phòng)\s*([A-Za-z0-9_-]+)/i;
            const roomMatch = text.match(roomRegex);
            if (roomMatch) {
                extractedRoom = 'P.' + roomMatch[1].trim();
                text = text.replace(roomRegex, '').trim();
            }

            // 3. Trích xuất giảng viên: Giảng viên: ABC hoặc GV: ABC hoặc Lecturer: ABC
            const gvRegex = /[-–—]?\s*(?:Giảng\s*viên|GV|Lecturer):\s*([^)]*)$/i;
            const gvMatch = text.match(gvRegex);
            if (gvMatch) {
                extractedLecturer = gvMatch[1].trim();
                text = text.replace(gvRegex, '').trim();
            } else {
                // Kiểm tra dạng kết thúc: - MãGV (ví dụ: "[PFP191 - IA2102] - PhucNT40")
                const trailingGvRegex = /[-–—]\s*([A-Za-z0-9_]{3,20})$/;
                const trailingMatch = text.match(trailingGvRegex);
                if (trailingMatch && !text.startsWith(trailingMatch[0])) {
                    extractedLecturer = trailingMatch[1].trim();
                    text = text.replace(trailingGvRegex, '').trim();
                }
            }

            // 4. Tính toán thời lượng (duration tính theo phút) từ chuỗi thời gian
            if (extractedTime) {
                const tm = extractedTime.match(/(\d{1,2}):(\d{2})\s*[-–—]\s*(\d{1,2}):(\d{2})/);
                if (tm) {
                    const startM = parseInt(tm[1], 10) * 60 + parseInt(tm[2], 10);
                    const endM = parseInt(tm[3], 10) * 60 + parseInt(tm[4], 10);
                    if (endM > startM) extractedDuration = endM - startM;
                }
            }

            // 5. Dọn dẹp ký tự nối (- : –) và khoảng trắng dư thừa ở đầu và cuối chuỗi
            text = text.replace(/^[-–—\s:]+|[-–—\s:]+$/g, '').replace(/\s+/g, ' ').trim();
            const hasMeta = !!(extractedRoom || extractedLecturer || extractedTime);

            return {
                cleanTitle: text || rawTaskText,
                time: extractedTime,
                room: extractedRoom,
                lecturer: extractedLecturer,
                duration: extractedDuration,
                hasMeta: hasMeta
            };
        }

        // Tạo giao diện 1 thẻ công việc phong cách FAP (Matrix View - Phase 2: Category, Subtasks, Deadline, Priority & Done)
        function createTaskHTML(taskObj) {
            const borderClass = getBorderColor(taskObj.quadrant);
            const parsed = parseTaskDetails(taskObj.task, taskObj.time);
            const isDone = !!taskObj.done;

            let metaItems = [];
            if (parsed.time) metaItems.push(`<span>⏰ ${parsed.time}</span>`);
            if (parsed.room) metaItems.push(`<span>📍 ${parsed.room}</span>`);
            if (parsed.lecturer) metaItems.push(`<span>👤 ${parsed.lecturer}</span>`);
            const metaHtml = metaItems.length > 0 
                ? `<div class="flex items-center gap-2 mt-1.5 text-[10px] text-slate-500 flex-wrap">${metaItems.join('<span class="text-slate-300">•</span>')}</div>` 
                : '';

            // Category tag badge
            let categoryHtml = '';
            const cat = getTaskCategory(taskObj);
            if (cat) {
                const col = getCategoryColor(cat);
                categoryHtml = `<span class="inline-flex items-center gap-1 text-[9px] font-bold px-1.5 py-0.5 rounded border ${col.bg} ${col.text} ${col.border}"><span>${col.icon}</span>${escapeHtml(cat)}</span>`;
            }

            // Subtasks progress indicator
            let subtasksHtml = '';
            const subProgress = getSubtasksProgress(taskObj.subtasks);
            if (subProgress) {
                const isAllDone = (subProgress.completed === subProgress.total);
                subtasksHtml = `
                    <div class="w-full mt-1.5 flex flex-col gap-0.5">
                        <div class="flex items-center justify-between text-[9px] text-slate-500 dark:text-slate-400">
                            <span class="inline-flex items-center gap-1 font-semibold ${isAllDone ? 'text-emerald-600 dark:text-emerald-400 font-bold' : ''}">
                                <span>☑️</span> Việc con: ${subProgress.completed}/${subProgress.total}
                            </span>
                            <span class="font-mono font-bold">${subProgress.percent}%</span>
                        </div>
                        <div class="w-full h-1 bg-slate-100 dark:bg-slate-800 rounded-full overflow-hidden">
                            <div class="h-full ${isAllDone ? 'bg-emerald-500' : 'bg-[#0054a6] dark:bg-blue-400'} rounded-full transition-all" style="width: ${subProgress.percent}%"></div>
                        </div>
                    </div>
                `;
            }

            // Deadline badge
            let deadlineHtml = '';
            if (taskObj.deadline) {
                const dlInfo = formatDeadlineInfo(taskObj.deadline);
                if (dlInfo) {
                    deadlineHtml = `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-semibold border ${dlInfo.badgeClass}" title="Hạn chót: ${dlInfo.dateFormatted}"><span>${dlInfo.icon}</span> ${dlInfo.text}</span>`;
                }
            }

            // Priority badge (nếu cao hoặc thấp)
            let priorityHtml = '';
            if (taskObj.priority === 'high') {
                priorityHtml = `<span class="inline-flex items-center gap-0.5 text-[9px] font-bold px-1.5 py-0.5 rounded border border-red-200 bg-red-50 text-red-700 dark:bg-red-950/40 dark:text-red-300 dark:border-red-800">🔴 Cao</span>`;
            } else if (taskObj.priority === 'low') {
                priorityHtml = `<span class="inline-flex items-center gap-0.5 text-[9px] font-bold px-1.5 py-0.5 rounded border border-emerald-200 bg-emerald-50 text-emerald-700 dark:bg-emerald-950/40 dark:text-emerald-300 dark:border-emerald-800">🟢 Thấp</span>`;
            }

            // Trạng thái đã xong
            const doneBadgeHtml = isDone 
                ? `<span class="inline-flex items-center gap-1 text-[10px] font-bold text-emerald-600 bg-emerald-50 dark:bg-emerald-950/40 px-1.5 py-0.5 rounded border border-emerald-200">✅ Đã xong</span>` 
                : '';

            // Schedule status badge (Đã lên lịch biểu hay chưa)
            let scheduleBadgeHtml = '';
            const dayNamesShort = ['T2', 'T3', 'T4', 'T5', 'T6', 'T7', 'CN'];
            const hasValidDay = (taskObj.day !== undefined && taskObj.day !== null && taskObj.day !== '');
            const hasValidTime = (taskObj.time && String(taskObj.time).trim() !== '');

            if (hasValidDay && hasValidTime) {
                const dIdx = parseInt(taskObj.day, 10);
                const dayLabel = dayNamesShort[dIdx] || 'Lịch';
                scheduleBadgeHtml = `<button type="button" onclick="event.stopPropagation(); openScheduleModalForTask('${taskObj.id}')" class="inline-flex items-center gap-0.5 text-[9px] font-bold px-1.5 py-0.5 rounded border border-blue-200 bg-blue-50 dark:bg-blue-950/40 text-[#0054a6] dark:text-blue-300 hover:bg-blue-100 dark:hover:bg-blue-900 cursor-pointer transition-colors" title="Bấm để điều chỉnh ngày & giờ thực hiện"><span>⏰</span> ${dayLabel}: ${taskObj.time}</button>`;
            } else if (taskObj.quadrant && taskObj.quadrant !== 'inbox' && !isDone) {
                scheduleBadgeHtml = `<button type="button" onclick="event.stopPropagation(); openScheduleModalForTask('${taskObj.id}')" class="inline-flex items-center gap-0.5 text-[9px] font-bold px-1.5 py-0.5 rounded border border-amber-300 border-dashed bg-amber-50 dark:bg-amber-950/40 text-amber-800 dark:text-amber-300 hover:bg-amber-100 dark:hover:bg-amber-900 cursor-pointer transition-colors" title="Chưa có khung giờ trên Trang chính & Lịch rảnh. Bấm để xếp lịch ngay!"><span>⚡</span> Chưa xếp giờ</button>`;
            }

            return `
                <div class="task-card bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-lg p-2.5 shadow-2xs flex items-start gap-2 group ${borderClass} ${isDone ? 'opacity-70 bg-slate-50/60 dark:bg-slate-900/60' : ''}" data-id="${taskObj.id}">
                    <input type="checkbox" ${isDone ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleTaskDone('${taskObj.id}')" title="${isDone ? 'Đánh dấu chưa xong' : 'Đánh dấu hoàn thành'}" class="mt-1 w-4 h-4 text-[#0054a6] rounded border-slate-300 focus:ring-[#0054a6] cursor-pointer shrink-0">
                    <div class="flex-1 min-w-0 pr-1 cursor-pointer" onclick="openTaskDetailModal('${taskObj.id}')">
                        <span class="text-xs font-semibold leading-relaxed break-words block ${isDone ? 'line-through text-slate-400 dark:text-slate-500 font-normal' : 'text-slate-800 dark:text-slate-100'}" id="text-${taskObj.id}">${parsed.cleanTitle}</span>
                        ${metaHtml}
                        ${subtasksHtml}
                        <div class="flex items-center gap-1.5 mt-2 flex-wrap text-[10px]">
                            ${categoryHtml}
                            ${scheduleBadgeHtml}
                            ${deadlineHtml}
                            ${priorityHtml}
                            ${doneBadgeHtml}
                        </div>
                    </div>
                    <div class="flex gap-0.5 opacity-0 group-hover:opacity-100 transition-opacity shrink-0">
                        <button type="button" onclick="event.stopPropagation(); openScheduleModalForTask('${taskObj.id}')" title="Lên lịch thực hiện" class="text-slate-400 hover:text-[#0054a6] p-1 rounded hover:bg-blue-50 dark:hover:bg-slate-800 cursor-pointer">📅</button>
                        <button type="button" onclick="event.stopPropagation(); editTask('${taskObj.id}')" title="Sửa công việc" class="text-slate-400 hover:text-[#0054a6] p-1 rounded hover:bg-blue-50 dark:hover:bg-slate-800 cursor-pointer">✏️</button>
                        <button type="button" onclick="event.stopPropagation(); deleteTask('${taskObj.id}')" title="Xóa công việc" class="text-slate-400 hover:text-red-600 p-1 rounded hover:bg-red-50 dark:hover:bg-slate-800 cursor-pointer">🗑️</button>
                    </div>
                </div>
            `;
        }

        // Cập nhật số đếm Inbox & Trạng thái rỗng
        function updateInboxCount() {
            const inboxEl = document.getElementById('inbox');
            const count = inboxEl?.querySelectorAll('.task-card').length || 0;
            const badge = document.getElementById('inboxCount');
            if (badge) badge.innerText = count;

            if (inboxEl) {
                if (count === 0 && !document.getElementById('loading')) {
                    if (!inboxEl.querySelector('.inbox-empty-hint')) {
                        inboxEl.innerHTML = `<div class="inbox-empty-hint w-full py-5 text-center text-xs text-slate-400 dark:text-slate-500 italic no-drag select-none flex items-center justify-center gap-2"><span class="text-base">✨</span> Hiện không có việc chưa sắp xếp. Hãy thêm việc mới từ khung bên phải hoặc kéo việc vào đây!</div>`;
                    }
                } else if (count > 0) {
                    inboxEl.querySelectorAll('.inbox-empty-hint').forEach(e => e.remove());
                }
            }
        }

        // Cuộn ngang danh sách Chưa sắp xếp (Inbox)
        function scrollInbox(direction) {
            const el = document.getElementById('inbox');
            if (!el) return;
            const scrollDistance = 280;
            el.scrollBy({ left: direction === 'left' ? -scrollDistance : scrollDistance, behavior: 'smooth' });
        }



        // =====================================================================
        // THÊM NHANH CHO NGÀY CỤ THỂ
        // =====================================================================
        function openDayAddModal(dayIdx = 0, defaultTime = '') {
            activeDayAddIndex = dayIdx;
            const days = getWeekDays(currentWeekOffset);
            const dayObj = days[dayIdx] || days[0];

            const titleEl = document.getElementById('dayAddModalTitle');
            if (titleEl) {
                titleEl.innerText = defaultTime 
                    ? `Thêm việc vào ${dayObj.name} (Khung giờ rảnh: ${defaultTime})` 
                    : `Thêm việc vào ${dayObj.name} (${dayObj.dateStr})`;
            }
            
            const targetDayInput = document.getElementById('dayAddTargetDay');
            if (targetDayInput) targetDayInput.value = dayIdx;

            const taskTitleInput = document.getElementById('dayAddTaskTitle');
            if (taskTitleInput) taskTitleInput.value = '';

            const taskTimeInput = document.getElementById('dayAddTaskTime');
            if (taskTimeInput) taskTimeInput.value = defaultTime || '';

            const deadlineInput = document.getElementById('dayAddTaskDeadline');
            if (deadlineInput && dayObj.fullDate) {
                const dlDate = new Date(dayObj.fullDate);
                dlDate.setHours(23, 59, 0, 0);
                const localIso = new Date(dlDate.getTime() - dlDate.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
                deadlineInput.value = localIso;
            }

            document.getElementById('dayAddModal')?.classList.remove('hidden');
            setTimeout(() => taskTitleInput?.focus(), 80);
        }

        function closeDayAddModal() {
            document.getElementById('dayAddModal')?.classList.add('hidden');
        }

        function submitDayTask(event) {
            event.preventDefault();
            const titleInput = document.getElementById('dayAddTaskTitle');
            const timeInput = document.getElementById('dayAddTaskTime');
            const quadInput = document.getElementById('dayAddTaskQuad');
            const deadlineInput = document.getElementById('dayAddTaskDeadline');
            const categoryInput = document.getElementById('dayAddTaskCategory');
            const targetDay = parseInt(document.getElementById('dayAddTargetDay')?.value || '0', 10);

            const title = titleInput?.value?.trim();
            if (!title) return;

            const time = timeInput?.value?.trim() || '';
            const quadrant = quadInput?.value || 'plan';
            const deadline = deadlineInput?.value || '';
            let category = categoryInput?.value?.trim() || '';
            category = normalizeCategory(category, title);

            if (categoryInput) categoryInput.value = 'Học tập';

            const newTaskObj = {
                id: 'task_' + Date.now(),
                task: title,
                category: category,
                subtasks: [],
                quadrant: quadrant,
                day: targetDay,
                time: time,
                deadline: deadline,
                priority: quadrant === 'donow' ? 'high' : 'medium',
                done: false
            };

            allTasksList.push(newTaskObj);
            renderDashboard();
            renderTasks(allTasksList);
            closeDayAddModal();

            if (window.google && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(serverTask => {
                        if (serverTask && serverTask.id) {
                            newTaskObj.id = serverTask.id;
                        }
                    })
                    .addTask(title, {
                        quadrant: quadrant,
                        day: targetDay,
                        time: time,
                        deadline: deadline,
                        priority: newTaskObj.priority,
                        category: category,
                        subtasks: '[]',
                        done: false,
                        userEmail: currentUserEmail
                    });
            }

            showToast('Đã thêm công việc vào lịch!', '✅');
        }



        // =====================================================================
        // BỘ LỌC MA TRẬN EISENHOWER (PHASE 2)
        // =====================================================================
        let matrixFilter = 'all'; // 'all' | 'active' | 'done'
        let matrixHideDone = false;

        function setMatrixFilter(filterType) {
            matrixFilter = filterType;
            const allBtn = document.getElementById('filterAllBtn');
            const activeBtn = document.getElementById('filterActiveBtn');
            const doneBtn = document.getElementById('filterDoneBtn');

            [allBtn, activeBtn, doneBtn].forEach(b => {
                if (b) {
                    b.className = 'px-2.5 py-1 rounded-lg text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-white dark:hover:bg-slate-700 transition-all cursor-pointer';
                }
            });

            if (filterType === 'all' && allBtn) {
                allBtn.className = 'px-2.5 py-1 rounded-lg text-xs font-bold bg-[#0054a6] text-white shadow-2xs transition-all cursor-pointer';
            } else if (filterType === 'active' && activeBtn) {
                activeBtn.className = 'px-2.5 py-1 rounded-lg text-xs font-bold bg-[#0054a6] text-white shadow-2xs transition-all cursor-pointer';
            } else if (filterType === 'done' && doneBtn) {
                doneBtn.className = 'px-2.5 py-1 rounded-lg text-xs font-bold bg-emerald-600 text-white shadow-2xs transition-all cursor-pointer';
            }

            renderTasks(allTasksList);
        }

        function toggleHideDone(checked) {
            matrixHideDone = !!checked;
            try {
                localStorage.setItem(STORAGE_KEY_HIDE_DONE, matrixHideDone ? 'true' : 'false');
            } catch(e) {}
            renderTasks(allTasksList);
        }



        // =====================================================================
        // TIỆN ÍCH DURATION, DEADLINE & THỜI GIAN THỰC HIỆN
        // =====================================================================
        function formatDurationText(mins) {
            const m = parseInt(mins, 10) || 0;
            if (m < 60) return `${m} phút`;
            const h = Math.floor(m / 60);
            const r = m % 60;
            return r === 0 ? `${h} giờ` : `${h} giờ ${r} phút`;
        }

        function updateDurationDisplay(sliderId, labelId) {
            const slider = document.getElementById(sliderId);
            const label = document.getElementById(labelId);
            if (slider && label) {
                label.innerText = formatDurationText(slider.value);
            }
        }

        function setDurationQuick(sliderId, labelId, val) {
            const slider = document.getElementById(sliderId);
            if (slider) {
                slider.value = val;
                updateDurationDisplay(sliderId, labelId);
            }
        }

        // =====================================================================
        // CUSTOM DATE & TIME PICKER CHO HẠN CHÓT (CÓ NÚT ✅ TO RÕ RÀNG)
        // =====================================================================
        let customDatePickerTargetInputId = 'taskDeadline';

        function initCustomDatePickerHours() {
            const hSelect = document.getElementById('pickerHourSelect');
            if (hSelect && hSelect.options.length === 0) {
                for (let h = 0; h < 24; h++) {
                    const hStr = ('0' + h).slice(-2);
                    const opt = document.createElement('option');
                    opt.value = hStr;
                    opt.textContent = `${hStr} giờ`;
                    if (h === 18) opt.selected = true;
                    hSelect.appendChild(opt);
                }
            }
        }

        function openCustomDatePicker(targetInputId) {
            customDatePickerTargetInputId = targetInputId || 'taskDeadline';
            initCustomDatePickerHours();

            const targetInput = document.getElementById(customDatePickerTargetInputId);
            const dateInput = document.getElementById('pickerDateInput');
            const hSelect = document.getElementById('pickerHourSelect');
            const mSelect = document.getElementById('pickerMinuteSelect');

            let currentVal = targetInput?.value || '';
            let dateObj = null;

            if (currentVal) {
                const parsed = new Date(currentVal);
                if (!isNaN(parsed.getTime())) {
                    dateObj = parsed;
                }
            }

            if (!dateObj) {
                dateObj = new Date();
                dateObj.setHours(18, 0, 0, 0);
            }

            const yyyy = dateObj.getFullYear();
            const mm = ('0' + (dateObj.getMonth() + 1)).slice(-2);
            const dd = ('0' + dateObj.getDate()).slice(-2);
            const hh = ('0' + dateObj.getHours()).slice(-2);
            const min = ('0' + dateObj.getMinutes()).slice(-2);

            if (dateInput) dateInput.value = `${yyyy}-${mm}-${dd}`;
            if (hSelect) hSelect.value = hh;
            if (mSelect) {
                if (['00', '15', '30', '45', '59'].includes(min)) {
                    mSelect.value = min;
                } else if (parseInt(min, 10) >= 50) {
                    mSelect.value = '59';
                } else {
                    mSelect.value = '00';
                }
            }

            updatePickerPreview();
            document.getElementById('customDatePickerModal')?.classList.remove('hidden');
        }

        function closeCustomDatePicker() {
            document.getElementById('customDatePickerModal')?.classList.add('hidden');
        }

        function setPickerDateQuick(offsetDays) {
            const d = new Date();
            d.setDate(d.getDate() + offsetDays);
            const yyyy = d.getFullYear();
            const mm = ('0' + (d.getMonth() + 1)).slice(-2);
            const dd = ('0' + d.getDate()).slice(-2);
            const dateInput = document.getElementById('pickerDateInput');
            if (dateInput) dateInput.value = `${yyyy}-${mm}-${dd}`;
            updatePickerPreview();
        }

        function setPickerTimeQuick(timeStr) {
            const parts = timeStr.split(':');
            const hSelect = document.getElementById('pickerHourSelect');
            const mSelect = document.getElementById('pickerMinuteSelect');
            if (hSelect && parts[0]) hSelect.value = parts[0];
            if (mSelect && parts[1]) mSelect.value = parts[1];
            updatePickerPreview();
        }

        function updatePickerPreview() {
            const dateInput = document.getElementById('pickerDateInput');
            const hSelect = document.getElementById('pickerHourSelect');
            const mSelect = document.getElementById('pickerMinuteSelect');
            const previewEl = document.getElementById('pickerPreviewText');
            if (!dateInput || !hSelect || !mSelect || !previewEl) return;

            const dateVal = dateInput.value;
            const hVal = hSelect.value || '18';
            const mVal = mSelect.value || '00';

            if (!dateVal) {
                previewEl.innerText = `dd/mm, ${hVal}:${mVal}`;
                return;
            }

            const parts = dateVal.split('-');
            if (parts.length === 3) {
                const dd = parts[2];
                const mm = parts[1];
                previewEl.innerText = `${dd}/${mm}, ${hVal}:${mVal}`;
            }
        }

        function confirmCustomDatePicker() {
            const dateInput = document.getElementById('pickerDateInput');
            const hSelect = document.getElementById('pickerHourSelect');
            const mSelect = document.getElementById('pickerMinuteSelect');
            if (!dateInput || !dateInput.value) {
                showToast("Vui lòng chọn ngày trước khi xác nhận!", "⚠️");
                return;
            }

            const hVal = hSelect?.value || '18';
            const mVal = mSelect?.value || '00';
            const isoDateTime = `${dateInput.value}T${hVal}:${mVal}`;

            const targetInput = document.getElementById(customDatePickerTargetInputId);
            if (targetInput) {
                targetInput.value = isoDateTime;
            }

            updateDeadlineDisplayElement(customDatePickerTargetInputId, isoDateTime);
            closeCustomDatePicker();
            showToast("✅ Đã chọn hạn chót!", "✅");
        }

        function updateDeadlineDisplayElement(targetInputId, isoDateTime) {
            const displayTextId = targetInputId === 'taskDeadline' ? 'taskDeadlineDisplayText' : 'editTaskDeadlineDisplayText';
            const displayEl = document.getElementById(displayTextId);
            if (!displayEl) return;

            if (!isoDateTime) {
                displayEl.innerHTML = `<span class="text-slate-400">dd/mm, --:--</span>`;
                return;
            }

            try {
                const d = new Date(isoDateTime);
                if (isNaN(d.getTime())) {
                    displayEl.innerText = 'dd/mm, --:--';
                    return;
                }
                const pad = n => String(n).padStart(2, '0');
                const formatted = `${pad(d.getDate())}/${pad(d.getMonth() + 1)}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
                displayEl.innerHTML = `<span class="text-[#0054a6] dark:text-blue-400 font-bold">${formatted}</span>`;
            } catch(e) {
                displayEl.innerText = isoDateTime;
            }
        }

        function clearDeadline(targetInputId) {
            const input = document.getElementById(targetInputId);
            if (input) input.value = '';
            updateDeadlineDisplayElement(targetInputId, '');
            showToast("Đã xóa hạn chót", "ℹ️");
        }

            const targetDate = new Date();
            if (type === 'today18') {
                targetDate.setHours(18, 0, 0, 0);
            } else if (type === 'today23') {
                targetDate.setHours(23, 59, 0, 0);
            } else if (type === 'tomorrow18') {
                targetDate.setDate(targetDate.getDate() + 1);
                targetDate.setHours(18, 0, 0, 0);
            }

            const yyyy = targetDate.getFullYear();
            const mm = ('0' + (targetDate.getMonth() + 1)).slice(-2);
            const dd = ('0' + targetDate.getDate()).slice(-2);
            const hh = ('0' + targetDate.getHours()).slice(-2);
            const min = ('0' + targetDate.getMinutes()).slice(-2);

            const iso = `${yyyy}-${mm}-${dd}T${hh}:${min}`;
            const targetInput = document.getElementById(targetInputId);
            if (targetInput) targetInput.value = iso;
            updateDeadlineDisplayElement(targetInputId, iso);

            const pad = n => String(n).padStart(2, '0');
            showToast(`⏰ Đã đặt hạn chót: ${pad(targetDate.getHours())}:${pad(targetDate.getMinutes())} ngày ${pad(targetDate.getDate())}/${pad(targetDate.getMonth() + 1)}`, "✅");

        function calculateEndTimeFromStart(startTimeStr, durationMinutes) {
            if (!startTimeStr) return '';
            const parts = startTimeStr.split(':');
            if (parts.length < 2) return '';
            const startTotal = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10);
            const endTotal = Math.min(23 * 60 + 59, startTotal + parseInt(durationMinutes, 10));
            const endH = Math.floor(endTotal / 60);
            const endM = endTotal % 60;
            return ('0' + endH).slice(-2) + ':' + ('0' + endM).slice(-2);
        }

        // =====================================================================
        async function saveTaskToSupabase(taskObj) {
            if (!window.supabaseClient || !taskObj || !taskObj.id) return;
            const p = (async () => {
                try {
                    const subtasksData = Array.isArray(taskObj.subtasks) 
                        ? taskObj.subtasks 
                        : (typeof taskObj.subtasks === 'string' ? JSON.parse(taskObj.subtasks || '[]') : []);

                    const row = {
                        id: String(taskObj.id),
                        task: taskObj.task,
                        category: taskObj.category || 'Công việc',
                        subtasks: subtasksData,
                        quadrant: taskObj.quadrant || 'inbox',
                        day: (taskObj.day !== undefined && taskObj.day !== null && taskObj.day !== '') ? String(taskObj.day) : null,
                        time: taskObj.time || null,
                        duration: parseInt(taskObj.duration) || 30,
                        done: !!taskObj.done,
                        deadline: taskObj.deadline || null,
                        priority: taskObj.priority || 'medium',
                        owner_email: currentUserEmail || ADMIN_PRIMARY_EMAIL,
                        is_fap: String(taskObj.id).startsWith('fap_'),
                        updated_at: new Date().toISOString()
                    };

                    const { error } = await window.supabaseClient.from('tasks').upsert(row, { onConflict: 'id' });
                    if (error) console.warn('Lỗi Supabase upsert:', error);
                } catch (e) {
                    console.warn('Lỗi lưu task lên Supabase:', e);
                }
            })();
            if (typeof window.trackActiveSync === 'function') window.trackActiveSync(p);
            return p;
        }

        async function deleteTaskFromSupabase(taskId) {
            if (!window.supabaseClient || !taskId) return;
            const p = (async () => {
                try {
                    const { error } = await window.supabaseClient.from('tasks').delete().eq('id', String(taskId));
                    if (error) console.warn('Lỗi Supabase delete:', error);
                } catch (e) {
                    console.warn('Lỗi xóa task trên Supabase:', e);
                }
            })();
            if (typeof window.trackActiveSync === 'function') window.trackActiveSync(p);
            return p;
        }

        function editTask(id) {
            let task = allTasksList.find(t => String(t.id) === String(id));

                task = allTasksList.find(t => String(t.id).includes(String(id)) || String(id).includes(String(t.id)));

            activeEditTaskId = task.id;

            const input = document.getElementById('editTaskInput');

            const catInput = document.getElementById('editTaskCategory');
            const quadInput = document.getElementById('editTaskQuadrant');
            const dayInput = document.getElementById('editTaskDay');
            const durationInput = document.getElementById('editTaskDuration');

            if (input) input.value = task.task || '';
            if (catInput) catInput.value = normalizeCategory(task.category, task.task);
            if (deadlineInput) {
                let dlVal = task.deadline || '';
                if (dlVal && dlVal.length > 16) {
                    try {
                        const d = new Date(dlVal);
                        if (!isNaN(d.getTime())) {
                            dlVal = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
                        }
                    } catch(e) {}
                }
                deadlineInput.value = dlVal;
                updateDeadlineDisplayElement('editTaskDeadline', dlVal);
            }
            if (priorityInput) priorityInput.value = task.priority || 'medium';
            if (quadInput) quadInput.value = task.quadrant || 'inbox';
            if (dayInput) dayInput.value = (task.day !== undefined && task.day !== null && task.day !== '') ? String(task.day) : '';

            // Subtasks
            editingSubtasks = JSON.parse(JSON.stringify(parseTaskSubtasks(task.subtasks)));
            renderEditSubtasksList();

            // Duration & Time calculation
            const parsed = parseTaskDetails(task.task, task.time);
            const dur = (task.duration && parseInt(task.duration, 10) > 0) 
                ? parseInt(task.duration, 10) 
                : (parsed.duration > 0 ? parsed.duration : 60);

            if (durationInput) {
                durationInput.value = dur;
                updateDurationDisplay('editTaskDuration', 'editTaskDurationLabel');
            }

            // Time, Start Time & End Time
            let startTimeStr = '';
            let endTimeStr = '';
            const effectiveTime = task.time || parsed.time || '';
            if (effectiveTime) {
                const m = effectiveTime.match(/(\d{1,2}:\d{2})\s*[-–—]\s*(\d{1,2}:\d{2})/);
                if (m) {
                    startTimeStr = m[1].padStart(5, '0');
                    endTimeStr = m[2].padStart(5, '0');
                } else {
                    const single = effectiveTime.match(/(\d{1,2}:\d{2})/);
                    if (single) startTimeStr = single[1].padStart(5, '0');
                }
            }
            populateTimeSelectOptions('editTaskStartTime', startTimeStr);
            const endInput = document.getElementById('editTaskEndTime');
            if (endInput && endTimeStr) {
                endInput.value = endTimeStr;
                const previewEl = document.getElementById('editCalculatedTimePreview');
                if (previewEl) previewEl.innerText = `⏰ ${startTimeStr} - ${endTimeStr} (${formatDurationText(dur)})`;
            } else {
                updateEditCalculatedTime();
            }

            document.getElementById('editModal')?.classList.remove('hidden');
            setTimeout(() => {
                input?.focus();
                input?.select();
            }, 50);

        function saveAllBatchScheduledTasks() {
            const progressEl = document.getElementById('batchScheduleProgressStatus');
            const saveBtn = document.getElementById('btnSaveBatchSchedule');

            const matrixTasks = allTasksList.filter(t => !isFapClass(t) && !t.done);
            if (matrixTasks.length === 0) {
                closeScheduleModal();
                return;
            }

            const updates = [];
            let countScheduled = 0;

            matrixTasks.forEach(t => {
                const daySelect = document.getElementById(`batchDay_${t.id}`);
                const slider = document.getElementById(`batchDurationSlider_${t.id}`);
                const startSelect = document.getElementById(`batchStart_${t.id}`);
                const endInput = document.getElementById(`batchEnd_${t.id}`);

                if (daySelect) {
                    const dayVal = daySelect.value;
                    const durVal = slider ? parseInt(slider.value, 10) : (t.duration || 60);
                    const startVal = startSelect ? startSelect.value : '';
                    const endVal = endInput ? endInput.value : '';

                    if (dayVal !== '') {
                        t.day = parseInt(dayVal, 10);
                        t.duration = durVal;
                        if (startVal && endVal) {
                            t.time = `${startVal} - ${endVal}`;
                        }
                        if (t.quadrant === 'inbox' || !t.quadrant) {
                            t.quadrant = 'donow';
                        }
                        countScheduled++;
                    }

                    updates.push({
                        id: t.id,
                        fields: {
                            day: t.day !== '' ? t.day : '',
                            duration: t.duration,
                            time: t.time || '',
                            quadrant: t.quadrant || 'donow',
                            userEmail: currentUserEmail
                        }
                    });
                }
            });

            // Lưu vào localStorage ngay lập tức
            try {
                localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(allTasksList));
            } catch(e) {}

            // Cập nhật giao diện tức thì (0ms)
            renderTasks(allTasksList);
            if (typeof renderDashboard === 'function') renderDashboard();
            // Lưu lên Supabase & Hai chiều Google Sheets
            matrixTasks.forEach(t => {
                saveTaskToSupabase(t);
                sendBackgroundGasSync('syncFromWeb', { task: t });
            });

            // Hiển thị tiến trình đẩy lên
            if (progressEl) {
                progressEl.classList.remove('hidden');
                progressEl.innerHTML = `<span class="inline-flex items-center gap-1.5 text-blue-600 font-bold"><span class="animate-spin inline-block">🔄</span> Đang đẩy ${countScheduled} công việc lên Google Sheets...</span>`;
            }
            if (saveBtn) {
                saveBtn.disabled = true;
                saveBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }

            // Gửi lên server
            if (window.google && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(() => {
                        if (progressEl) {
                            progressEl.innerHTML = `<span class="text-emerald-600 font-bold">✅ Đã đồng bộ thành công!</span>`;
                        }
                        showToast(`🎉 Đã lưu và đẩy ${countScheduled} công việc lên Trang chính & Lịch rảnh!`, "🚀");
                        setTimeout(() => {
                            closeScheduleModal();
                            if (saveBtn) {
                                saveBtn.disabled = false;
                                saveBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                            }
                            switchView('dashboard');
                        }, 600);
                    })
                    .withFailureHandler(err => {
                        if (progressEl) {
                            progressEl.innerHTML = `<span class="text-amber-600">Đã lưu offline (Lỗi: ${err})</span>`;
                        }
                        if (saveBtn) {
                            saveBtn.disabled = false;
                            saveBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                        }
                        showToast(`Đã lưu cục bộ! Lỗi đồng bộ sheets: ${err}`, "⚠️");
                        setTimeout(() => {
                            closeScheduleModal();
                            switchView('dashboard');
                        }, 1000);
                    })
                    .batchUpdateTasks(updates, currentUserEmail);
            } else {
                if (progressEl) {
                    progressEl.innerHTML = `<span class="text-emerald-600 font-bold">✅ Đã lưu cục bộ thành công!</span>`;
                }
                showToast(`🎉 Đã lưu ${countScheduled} công việc lên Trang chính & Lịch rảnh!`, "🚀");
                setTimeout(() => {
                    closeScheduleModal();
                    if (saveBtn) {
                        saveBtn.disabled = false;
                        saveBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                    }
                    switchView('dashboard');
                }, 600);
            }
        }

        // =====================================================================

        let activeDetailTaskId = null;

        function openTaskDetailModal(taskId) {
            const task = allTasksList.find(t => String(t.id) === String(taskId));
            if (!task) return;
            activeDetailTaskId = taskId;

            const parsed = parseTaskDetails(task.task, task.time);
            const isCalendar = (task.source === 'fap' || task.source === 'calendar' || (task.id && String(task.id).startsWith('fap_')));
            const isDone = !!task.done;

            // Type badge
            const badgeIcon = document.getElementById('detailBadgeIcon');
            const badgeType = document.getElementById('detailBadgeType');
            if (badgeType) {
                if (isCalendar) {
                    if (badgeIcon) badgeIcon.innerText = '🎓';
                    badgeType.innerText = 'Lịch học FAP';
                    badgeType.className = 'text-[11px] font-extrabold uppercase tracking-wide px-2 py-0.5 rounded border border-blue-200 bg-blue-50 text-[#0054a6] dark:bg-blue-900/40 dark:text-blue-300 dark:border-blue-800';
                } else if (task.quadrant === 'donow') {
                    if (badgeIcon) badgeIcon.innerText = '🔴';
                    badgeType.innerText = 'Làm ngay';
                    badgeType.className = 'text-[11px] font-extrabold uppercase tracking-wide px-2 py-0.5 rounded border border-red-200 bg-red-50 text-red-700 dark:bg-red-900/40 dark:text-red-300 dark:border-red-800';
                } else {
                    if (badgeIcon) badgeIcon.innerText = '🟡';
                    badgeType.innerText = 'Kế hoạch';
                    badgeType.className = 'text-[11px] font-extrabold uppercase tracking-wide px-2 py-0.5 rounded border border-amber-200 bg-amber-50 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300 dark:border-amber-800';
                }
            }

            // Title
            const titleEl = document.getElementById('detailTitle');
            if (titleEl) {
                titleEl.innerText = parsed.cleanTitle || task.task;
                if (isDone) {
                    titleEl.classList.add('line-through', 'text-slate-400');
                } else {
                    titleEl.classList.remove('line-through', 'text-slate-400');
                }
            }

            // Day info
            const dayTextEl = document.getElementById('detailDayText');
            if (dayTextEl) {
                const dayIdx = parseInt(task.day, 10);
                const dayNames = ['Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy', 'Chủ Nhật'];
                const dayName = (!isNaN(dayIdx) && dayNames[dayIdx]) ? dayNames[dayIdx] : 'Chưa phân thứ';
                dayTextEl.innerText = `📅 ${dayName}`;
            }

            // Time, Duration, Room, Lecturer, Status
            const timeEl = document.getElementById('detailTime');
            if (timeEl) timeEl.innerText = parsed.time || 'Chưa đặt';

            const durEl = document.getElementById('detailDuration');
            if (durEl) {
                const durationMins = task.duration || parsed.duration || 0;
                if (durationMins > 0) {
                    const h = Math.floor(durationMins / 60);
                    const m = durationMins % 60;
                    const hText = h > 0 ? `${h}h ` : '';
                    const mText = m > 0 ? `${m}p` : '';
                    durEl.innerText = `${durationMins} phút (${(hText + mText).trim()})`;
                } else {
                    durEl.innerText = 'Chưa xác định';
                }
            }

            const roomEl = document.getElementById('detailRoom');
            if (roomEl) roomEl.innerText = parsed.room || 'Không có';

            const lecturerEl = document.getElementById('detailLecturer');
            if (lecturerEl) lecturerEl.innerText = parsed.lecturer || 'Không có';

            const statusEl = document.getElementById('detailStatus');
            if (statusEl) {
                statusEl.innerText = isDone ? 'Đã hoàn thành ✅' : 'Chưa hoàn thành ⏳';
                statusEl.className = isDone ? 'font-semibold text-emerald-600 dark:text-emerald-400' : 'font-semibold text-amber-600 dark:text-amber-400';
            }

            // Phase 2: Deadline & Priority trong modal chi tiết
            const deadlineEl = document.getElementById('detailDeadline');
            if (deadlineEl) {
                if (task.deadline) {
                    const dlInfo = formatDeadlineInfo(task.deadline);
                    if (dlInfo) {
                        deadlineEl.innerHTML = `<span class="inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[11px] font-semibold border ${dlInfo.badgeClass}"><span>${dlInfo.icon}</span> ${dlInfo.text}</span>`;
                    } else {
                        deadlineEl.innerText = task.deadline;
                    }
                } else {
                    deadlineEl.innerText = 'Không có';
                }
            }

            const priorityEl = document.getElementById('detailPriority');
            if (priorityEl) {
                if (task.priority === 'high') {
                    priorityEl.innerHTML = `<span class="text-red-600 font-bold">🔴 Cao (Khẩn cấp)</span>`;
                } else if (task.priority === 'low') {
                    priorityEl.innerHTML = `<span class="text-emerald-600 font-bold">🟢 Thấp (Linh hoạt)</span>`;
                } else {
                    priorityEl.innerHTML = `<span class="text-amber-600 font-bold">🟡 Trung bình</span>`;
                }
            }

            // Raw task text
            const rawEl = document.getElementById('detailRawTask');
            if (rawEl) rawEl.innerText = task.task;

            // Toggle done button text
            const toggleBtn = document.getElementById('detailToggleDoneBtn');
            if (toggleBtn) {
                toggleBtn.innerHTML = isDone 
                    ? `<span>↩️</span> Đánh dấu chưa xong` 
                    : `<span>✅</span> Đánh dấu hoàn thành`;
            }

            // Category badge (ẩn nếu là lịch học để không bị lặp badge)
            const cat = getTaskCategory(task);
            const catBadge = document.getElementById('detailCategoryBadge');
            if (catBadge) {
                if (!isCalendar && cat) {
                    const col = getCategoryColor(cat);
                    catBadge.innerHTML = `<span>${col.icon}</span> <span>${escapeHtml(cat)}</span>`;
                    catBadge.className = `inline-flex items-center gap-1 text-[11px] font-bold px-2 py-0.5 rounded border ${col.bg} ${col.text} ${col.border}`;
                    catBadge.classList.remove('hidden');
                } else {
                    catBadge.classList.add('hidden');
                }
            }

            // Phase 2: Render checklist việc con
            renderDetailSubtasks(task);

            // Show modal
            const modal = document.getElementById('taskDetailModal');
            if (modal) modal.classList.remove('hidden');
        }

        function renderDetailSubtasks(task) {
            const subtasks = parseTaskSubtasks(task.subtasks);
            const progress = getSubtasksProgress(subtasks);
            const progressText = document.getElementById('detailSubtasksProgressText');
            const progressBar = document.getElementById('detailSubtasksProgressBar');
            const listEl = document.getElementById('detailSubtasksList');

            if (progressText && progressBar) {
                if (progress) {
                    progressText.innerText = `${progress.completed}/${progress.total} (${progress.percent}%)`;
                    progressBar.style.width = `${progress.percent}%`;
                    if (progress.completed === progress.total) {
                        progressBar.className = 'h-full bg-emerald-500 rounded-full transition-all duration-300';
                    } else {
                        progressBar.className = 'h-full bg-[#0054a6] dark:bg-blue-500 rounded-full transition-all duration-300';
                    }
                } else {
                    progressText.innerText = '0/0 (0%)';
                    progressBar.style.width = '0%';
                }
            }

            if (listEl) {
                if (subtasks.length === 0) {
                    listEl.innerHTML = `<p class="text-[11px] text-slate-400 dark:text-slate-500 italic py-1">Chưa có việc con nào. Nhập và bấm Thêm bên dưới!</p>`;
                } else {
                    listEl.innerHTML = subtasks.map(s => {
                        const isDone = !!s.done;
                        return `
                            <div class="flex items-center justify-between gap-2 p-1.5 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800/80 transition-colors group">
                                <label class="flex items-center gap-2 flex-1 min-w-0 cursor-pointer">
                                    <input type="checkbox" ${isDone ? 'checked' : ''} onchange="toggleSubtaskDirect('${task.id}', '${s.id}')" class="w-3.5 h-3.5 text-[#0054a6] rounded border-slate-300 focus:ring-[#0054a6] cursor-pointer shrink-0">
                                    <span class="text-xs ${isDone ? 'line-through text-slate-400 dark:text-slate-500' : 'text-slate-700 dark:text-slate-200 font-medium'} leading-tight break-words">${escapeHtml(s.text)}</span>
                                </label>
                                <button type="button" onclick="deleteSubtaskDirect('${task.id}', '${s.id}')" class="text-slate-300 hover:text-red-500 dark:text-slate-600 dark:hover:text-red-400 p-1 rounded opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer text-xs" title="Xóa việc con này">
                                    🗑️
                                </button>
                            </div>
                        `;
                    }).join('');
                }
            }
        }

        function addQuickSubtaskFromDetail() {
            if (!activeDetailTaskId) return;
            const input = document.getElementById('detailQuickSubtaskInput');
            const text = input?.value?.trim();
            if (!text) return;

            const task = allTasksList.find(t => String(t.id) === String(activeDetailTaskId));
            if (!task) return;

            task.subtasks = parseTaskSubtasks(task.subtasks);
            task.subtasks.push({
                id: 'sub_' + Date.now(),
                text: text,
                done: false
            });

            if (input) input.value = '';
            try {
                localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(allTasksList));
            } catch(e) {}

            renderDetailSubtasks(task);
            renderDashboard();
            renderTasks(allTasksList);

            // Đồng bộ Supabase & Hai chiều Google Sheets
            saveTaskToSupabase(task);
            sendBackgroundGasSync('syncFromWeb', { task: task });

            if (window.google && google.script && google.script.run) {
                google.script.run
                    .withFailureHandler(err => showToast('Lỗi lưu việc con: ' + err, '⚠️'))
                    .updateTask(task.id, { subtasks: JSON.stringify(task.subtasks), userEmail: currentUserEmail });
            }
            showToast("Đã thêm việc con mới!", "☑️");
        }

        function toggleSubtaskDirect(taskId, subTaskId) {
            const task = allTasksList.find(t => String(t.id) === String(taskId));
            if (!task) return;

            task.subtasks = parseTaskSubtasks(task.subtasks);
            const sub = task.subtasks.find(s => String(s.id) === String(subTaskId));
            if (!sub) return;

            sub.done = !sub.done;

            try {
                localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(allTasksList));
            } catch(e) {}

            if (activeDetailTaskId && String(activeDetailTaskId) === String(taskId)) {
                renderDetailSubtasks(task);
            }
            renderDashboard();
            renderTasks(allTasksList);

            // Đồng bộ Supabase & Hai chiều Google Sheets
            saveTaskToSupabase(task);
            sendBackgroundGasSync('syncFromWeb', { task: task });

            if (window.google && google.script && google.script.run) {
                google.script.run
                    .withFailureHandler(err => showToast('Lỗi cập nhật việc con: ' + err, '⚠️'))
                    .toggleSubTask(taskId, subTaskId, currentUserEmail);
            }
        }

        function deleteSubtaskDirect(taskId, subTaskId) {
            const task = allTasksList.find(t => String(t.id) === String(taskId));
            if (!task) return;

            task.subtasks = parseTaskSubtasks(task.subtasks).filter(s => String(s.id) !== String(subTaskId));

            try {
                localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(allTasksList));
            } catch(e) {}

            if (activeDetailTaskId && String(activeDetailTaskId) === String(taskId)) {
                renderDetailSubtasks(task);
            }
            renderDashboard();
            renderTasks(allTasksList);

            // Đồng bộ Supabase & Hai chiều Google Sheets
            saveTaskToSupabase(task);
            sendBackgroundGasSync('syncFromWeb', { task: task });

            if (window.google && google.script && google.script.run) {
                google.script.run
                    .withFailureHandler(err => showToast('Lỗi xóa việc con: ' + err, '⚠️'))
                    .updateTask(taskId, { subtasks: JSON.stringify(task.subtasks), userEmail: currentUserEmail });
            }
            showToast("Đã xóa việc con!", "🗑️");
        }

        function closeTaskDetailModal() {
            const modal = document.getElementById('taskDetailModal');
            if (modal) modal.classList.add('hidden');
            activeDetailTaskId = null;
        }

        function toggleTaskDoneFromModal() {
            if (!activeDetailTaskId) return;
            const taskId = activeDetailTaskId;
            toggleTaskDone(taskId);
            // Cập nhật lại giao diện modal sau khi đổi trạng thái
            openTaskDetailModal(taskId);
        }

        function deleteTaskFromModal() {
            if (!activeDetailTaskId) return;
            const taskId = activeDetailTaskId;
            closeTaskDetailModal();
            deleteTask(taskId);
        }

        function deleteTask(id) {
            activeDeleteTaskId = id;
            const task = allTasksList.find(t => String(t.id) === String(id));
            const el = document.getElementById(`text-${id}`);
            const title = task ? task.task : (el ? el.innerText.trim() : 'công việc này');
            const snippet = title.length > 50 ? title.slice(0, 50) + '...' : title;
            const desc = document.getElementById('deleteModalDesc');
            if (desc) desc.innerText = `Bạn có chắc chắn muốn xóa: "${snippet}"?`;
            
            document.getElementById('deleteModal').classList.remove('hidden');
            setTimeout(() => {
                document.getElementById('confirmDeleteBtn')?.focus();
            }, 60);
        }

        function submitDeleteTask() {
            if (!activeDeleteTaskId) return;
            const targetId = activeDeleteTaskId;
            allTasksList = allTasksList.filter(t => String(t.id) !== String(targetId));
            try {
                localStorage.setItem(STORAGE_KEY_TASKS, JSON.stringify(allTasksList));
            } catch(e) {}
            
            document.querySelector(`[data-id="${targetId}"]`)?.remove();
            document.querySelector(`[data-task-id="${targetId}"]`)?.remove();
            updateInboxCount();
            renderDashboard();

            // Xóa tức thời trên Supabase & Hai chiều Google Sheets
            deleteTaskFromSupabase(targetId);
            sendBackgroundGasSync('deleteFromWeb', { taskId: targetId });

            if (window.google && google.script && google.script.run) {
                google.script.run.deleteTask(targetId, currentUserEmail);
            }
            showToast("Đã xóa công việc thành công!", "🗑️");
            closeDeleteModal();
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').classList.add('hidden');
            activeDeleteTaskId = null;
        }

        // Hỗ trợ phím tắt bàn phím toàn diện (Enter: Thực hiện Action, Esc: Hủy)
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeTaskDetailModal();
                closeEditModal();
                closeDeleteModal();
                closeProfileModal();
                closeModal();
                closePwaModal();
                return;
            }
            if (e.key === 'Enter') {
                // 1. Khi đang mở hộp thoại Xác nhận xóa: Nhấn Enter xóa ngay lập tức!
                if (activeDeleteTaskId) {
                    e.preventDefault();
                    submitDeleteTask();
                    return;
                }
                // 2. Khi đang mở hộp thoại Sửa việc (và không giữ Shift): Nhấn Enter lưu ngay lập tức!
                if (activeEditTaskId && !e.shiftKey) {
                    e.preventDefault();
                    submitEditTask();
                    return;
                }
                // 3. Khi đang mở hộp thoại Hồ sơ cá nhân (và không giữ Shift): Nhấn Enter lưu hồ sơ!
                const profileModal = document.getElementById('profileModal');
                if (profileModal && !profileModal.classList.contains('hidden') && !e.shiftKey) {
                    e.preventDefault();
                    saveProfile(); // Phase 1: dùng saveProfile thay vì saveMotto
                    return;
                }
            }
        });

        // GỌI AI GỢI Ý
</script>
