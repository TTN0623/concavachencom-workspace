<script>
async function loadAdminStats() {
            if (!isCurrentUserAdmin) {
                showToast('Chỉ Admin trtainguyen2306@gmail.com mới có quyền xem trang này!', '⚠️');
                switchView('dashboard');
                return;
            }

            const usersTableBody = document.getElementById('adminUsersTableBody');
            const feedbackTableBody = document.getElementById('adminFeedbackTableBody');
            if (usersTableBody) usersTableBody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400"><div class="inline-block animate-spin mr-2">⏳</div> Đang tải danh sách người dùng...</td></tr>`;
            if (feedbackTableBody) feedbackTableBody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400"><div class="inline-block animate-spin mr-2">⏳</div> Đang tải danh sách phản hồi...</td></tr>`;

            // 1. Chế độ Google Apps Script (nếu chạy trong iframe Apps Script)
            if (window.google && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(renderAdminStats)
                    .withFailureHandler(err => {
                        showToast('Lỗi tải dữ liệu quản trị: ' + err, '❌');
                    })
                    .getAdminStats(currentUserEmail);
                return;
            }

            // 2. Chế độ Supabase Client (Chạy trên concavachencom.site độc lập)
            if (window.supabaseClient) {
                try {
                    // Lấy danh sách tài khoản người dùng
                    const { data: usersData, error: usersErr } = await window.supabaseClient
                        .from('users')
                        .select('*')
                        .order('created_at', { ascending: false });
                    
                    if (usersErr) console.warn('Lỗi tải danh sách users từ Supabase:', usersErr);

                    if (Array.isArray(usersData) && usersData.length > 0) {
                        usersList = usersData.map(u => ({
                            email: u.email || '',
                            fullName: u.full_name || u.email,
                            role: (u.email && u.email.toLowerCase() === ADMIN_PRIMARY_EMAIL.toLowerCase()) ? 'admin' : (u.role || 'user'),
                            status: u.status || 'active',
                            createdAt: u.created_at || new Date().toISOString(),
                            lastLoginAt: u.last_login_at || u.last_sign_in_at || u.updated_at || u.created_at || new Date().toISOString(),
                            tasksCount: 0
                        }));
                    } else {
                        usersList = [{
                            email: currentUserEmail || ADMIN_PRIMARY_EMAIL,
                            fullName: 'Trọng Tài Nguyễn',
                            role: 'admin',
                            status: 'active',
                            createdAt: new Date().toISOString(),
                            lastLoginAt: new Date().toISOString(),
                            tasksCount: allTasksList.length
                        }];
                    }

                    // Đếm tổng số công việc
                    let totalTasksCount = allTasksList.length;
                    try {
                        const { count } = await window.supabaseClient
                            .from('tasks')
                            .select('*', { count: 'exact', head: true });
                        if (typeof count === 'number' && count > 0) totalTasksCount = count;
                    } catch(e) {}

                    usersList.forEach(u => {
                        if (u.email && u.email.toLowerCase() === currentUserEmail.toLowerCase()) {
                            u.tasksCount = allTasksList.length;
                        }
                    });

                    // Lấy phản hồi & góp ý từ bảng feedbacks
                    let feedbacksList = [];
                    let newFeedbackCount = 0;
                    try {
                        const { data: fbData } = await window.supabaseClient
                            .from('feedbacks')
                            .select('*')
                            .order('created_at', { ascending: false });
                        if (Array.isArray(fbData)) {
                            feedbacksList = fbData.map(f => {
                                const st = String(f.status || 'new').toLowerCase();
                                if (st === 'new') newFeedbackCount++;
                                return {
                                    id: f.id,
                                    userEmail: f.user_email || f.email || '',
                                    category: f.category || 'Góp ý tính năng',
                                    content: f.content || '',
                                    createdAt: f.created_at || new Date().toISOString(),
                                    status: st
                                };
                            });
                        }
                    } catch(e) {
                        console.warn('Lấy feedbacks từ Supabase:', e);
                    }

                    renderAdminStats({
                        totalUsers: usersList.length,
                        activeUsers: usersList.filter(u => u.status === 'active').length,
                        totalTasks: totalTasksCount,
                        newFeedbackCount: newFeedbackCount,
                        users: usersList,
                        feedbacks: feedbacksList
                    });
                    return;
                } catch(supabaseAdminErr) {
                    console.error('Lỗi loadAdminStats từ Supabase:', supabaseAdminErr);
                }
            }

            // 3. Fallback an toàn (không bao giờ treo màn hình chờ của Admin)
            renderAdminStats({
                totalUsers: 1,
                activeUsers: 1,
                totalTasks: allTasksList.length,
                newFeedbackCount: 0,
                users: [{
                    email: currentUserEmail || ADMIN_PRIMARY_EMAIL,
                    fullName: 'Trọng Tài Nguyễn',
                    role: 'admin',
                    status: 'active',
                    createdAt: new Date().toISOString(),
                    lastLoginAt: new Date().toISOString(),
                    tasksCount: allTasksList.length
                }],
                feedbacks: []
            });
        }

        function renderAdminStats(data) {
            if (!data) return;

            // 1. Cập nhật các thẻ KPI
            const kpiUsers = document.getElementById('adminKpiTotalUsers');
            if (kpiUsers) kpiUsers.innerText = data.totalUsers || 0;
            const kpiActive = document.getElementById('adminKpiActiveUsers');
            if (kpiActive) kpiActive.innerText = data.activeUsers || 0;
            const kpiTasks = document.getElementById('adminKpiTotalTasks');
            if (kpiTasks) kpiTasks.innerText = data.totalTasks || 0;
            const kpiFb = document.getElementById('adminKpiNewFeedback');
            if (kpiFb) kpiFb.innerText = data.newFeedbackCount || 0;

            const usersLabel = document.getElementById('adminUsersCountLabel');
            if (usersLabel) usersLabel.innerText = `${data.totalUsers || 0} tài khoản`;
            const fbLabel = document.getElementById('adminFeedbackCountLabel');
            if (fbLabel) fbLabel.innerText = `${(data.feedbacks || []).length} phản hồi (${data.newFeedbackCount || 0} mới)`;

            // 2. Banner cảnh báo Feedback mới
            const alertBanner = document.getElementById('adminNewFeedbackAlertBanner');
            const alertText = document.getElementById('adminNewFeedbackAlertText');
            if (alertBanner && alertText) {
                if (data.newFeedbackCount > 0) {
                    alertText.innerText = `🔔 Có ${data.newFeedbackCount} phản hồi / góp ý mới từ người dùng!`;
                    alertBanner.classList.remove('hidden');
                } else {
                    alertBanner.classList.add('hidden');
                }
            }

            // 3. Render bảng người dùng
            const usersTbody = document.getElementById('adminUsersTableBody');
            if (usersTbody) {
                if (!data.users || data.users.length === 0) {
                    usersTbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400">Chưa có người dùng nào được ghi nhận.</td></tr>`;
                } else {
                    usersTbody.innerHTML = data.users.map(u => {
                        const isMainAdmin = (u.email.toLowerCase() === ADMIN_PRIMARY_EMAIL.toLowerCase());
                        const roleBadge = isMainAdmin
                            ? `<span class="px-2 py-0.5 rounded-full font-bold bg-rose-100 text-rose-700 text-[10px]">Super Admin</span>`
                            : (u.role === 'admin' 
                                ? `<span class="px-2 py-0.5 rounded-full font-bold bg-purple-100 text-purple-700 text-[10px]">Admin</span>` 
                                : `<span class="px-2 py-0.5 rounded-full font-medium bg-slate-100 text-slate-700 text-[10px]">User</span>`);

                        const statusBadge = (u.status === 'blocked')
                            ? `<span class="px-2 py-0.5 rounded-full font-bold bg-red-100 text-red-700 text-[10px]">Đã khóa</span>`
                            : `<span class="px-2 py-0.5 rounded-full font-bold bg-emerald-100 text-emerald-700 text-[10px]">Hoạt động</span>`;

                        const lastLogin = u.lastLoginAt ? new Date(u.lastLoginAt).toLocaleString('vi-VN') : 'Chưa có';
                        const deleteBtn = isMainAdmin 
                            ? `<span class="text-slate-400 italic text-[11px]">Không thể xóa</span>`
                            : `<button type="button" onclick="handleAdminDeleteUser('${u.email}')" class="px-2.5 py-1 text-[11px] font-semibold rounded-lg transition-colors cursor-pointer bg-rose-50 text-rose-700 hover:bg-rose-100 hover:text-rose-800 border border-rose-200 dark:bg-rose-950/40 dark:text-rose-400 dark:border-rose-900/50 flex items-center gap-1 ml-auto" title="Xóa toàn bộ dữ liệu & tài khoản của người dùng này">
                                <span>Xóa tài khoản</span>
                               </button>`;

                        return `
                            <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors">
                                <td class="py-3 px-4">
                                    <div class="flex items-center gap-2.5">
                                        <div class="w-7 h-7 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 font-bold text-[11px] flex items-center justify-center shrink-0">
                                            ${(u.fullName || u.email).slice(0, 2).toUpperCase()}
                                        </div>
                                        <div class="truncate max-w-xs">
                                            <p class="font-bold text-slate-800 dark:text-slate-200">${u.fullName || 'Người dùng'}</p>
                                            <p class="text-[11px] text-slate-500 font-mono">${u.email}</p>
                                        </div>
                                    </div>
                                </td>
                                <td class="py-3 px-4">${roleBadge}</td>
                                <td class="py-3 px-4 text-slate-500 text-[11px]">${lastLogin}</td>
                                <td class="py-3 px-4 font-semibold text-slate-700 dark:text-slate-300">${u.tasksCount || 0} việc</td>
                                <td class="py-3 px-4">${statusBadge}</td>
                                <td class="py-3 px-4 text-right">${deleteBtn}</td>
                            </tr>
                        `;
                    }).join('');
                }
            }

            // 4. Render bảng Feedback
            const fbTbody = document.getElementById('adminFeedbackTableBody');
            if (fbTbody) {
                if (!data.feedbacks || data.feedbacks.length === 0) {
                    fbTbody.innerHTML = `<tr><td colspan="6" class="py-8 text-center text-slate-400">Chưa có phản hồi hoặc góp ý nào.</td></tr>`;
                } else {
                    fbTbody.innerHTML = data.feedbacks.map(f => {
                        const statusBadge = (f.status === 'new')
                            ? `<span class="px-2 py-0.5 rounded-full font-extrabold bg-rose-100 text-rose-700 text-[10px] animate-pulse">Mới</span>`
                            : (f.status === 'reviewed' 
                                ? `<span class="px-2 py-0.5 rounded-full font-bold bg-blue-100 text-blue-700 text-[10px]">Đã xem</span>`
                                : `<span class="px-2 py-0.5 rounded-full font-bold bg-emerald-100 text-emerald-700 text-[10px]">Đã xong</span>`);

                        const timeFormatted = f.createdAt ? new Date(f.createdAt).toLocaleString('vi-VN') : '';
                        
                        let actions = '';
                        if (f.status === 'new') {
                            actions = `<button type="button" onclick="handleAdminUpdateFeedback('${f.id}', 'reviewed')" class="px-2 py-1 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-md text-[11px] font-semibold cursor-pointer">Đánh dấu đã xem</button>`;
                        } else if (f.status === 'reviewed') {
                            actions = `<button type="button" onclick="handleAdminUpdateFeedback('${f.id}', 'resolved')" class="px-2 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded-md text-[11px] font-semibold cursor-pointer">Hoàn thành</button>`;
                        } else {
                            actions = `<span class="text-slate-400 text-[11px]">Đã giải quyết</span>`;
                        }

                        return `
                            <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/40 transition-colors ${f.status === 'new' ? 'bg-rose-50/20' : ''}">
                                <td class="py-3 px-4 text-slate-500 text-[11px] whitespace-nowrap">${timeFormatted}</td>
                                <td class="py-3 px-4 font-mono text-[11px] text-slate-700 dark:text-slate-300 font-semibold">${f.userEmail}</td>
                                <td class="py-3 px-4 whitespace-nowrap font-medium text-slate-600 dark:text-slate-300">${f.category}</td>
                                <td class="py-3 px-4 text-slate-800 dark:text-slate-200 max-w-md break-words">${f.content}</td>
                                <td class="py-3 px-4 whitespace-nowrap">${statusBadge}</td>
                                <td class="py-3 px-4 text-right whitespace-nowrap">${actions}</td>
                            </tr>
                        `;
                    }).join('');
                }
            }
        }

        async function handleAdminDeleteUser(targetEmail) {
            if (!targetEmail) return;
            if (targetEmail.toLowerCase() === ADMIN_PRIMARY_EMAIL.toLowerCase()) {
                showToast('Không thể xóa tài khoản của Super Admin!', '⚠️');
                return;
            }

            const confirmed = confirm(
                `⚠️ CẢNH BÁO QUAN TRỌNG:\n\nBạn có chắc chắn muốn XÓA VĨNH VIỄN toàn bộ dữ liệu của tài khoản:\n👉 ${targetEmail}?\n\n` +
                `• Toàn bộ công việc, nhiệm vụ (Tasks) của người này sẽ bị xóa sạch khỏi hệ thống.\n` +
                `• Tài khoản và phản hồi sẽ bị xóa hoàn toàn khỏi Database & Google Sheets.\n` +
                `• Khi người này đăng nhập lại trong tương lai, họ sẽ bắt đầu như một người dùng mới 100%.\n\n` +
                `Hành động này KHÔNG THỂ HOÀN TÁC! Bạn có chắc chắn muốn xóa?`
            );

            if (!confirmed) return;

            showToast(`Đang xóa toàn bộ dữ liệu của ${targetEmail}...`, '⏳');

            let errors = [];

            // 1. Xóa dữ liệu triệt để trên Supabase
            if (window.supabaseClient) {
                try {
                    // Xóa toàn bộ tasks thuộc người dùng này
                    const { error: errTasks } = await window.supabaseClient
                        .from('tasks')
                        .delete()
                        .eq('owner_email', targetEmail);
                    if (errTasks) console.warn('Lỗi xóa tasks trên Supabase:', errTasks);

                    // Xóa phản hồi / feedbacks của người dùng
                    try {
                        await window.supabaseClient
                            .from('feedbacks')
                            .delete()
                            .eq('user_email', targetEmail);
                    } catch(e) {}

                    // Xóa dòng người dùng khỏi bảng users
                    const { error: errUser } = await window.supabaseClient
                        .from('users')
                        .delete()
                        .eq('email', targetEmail);
                    if (errUser) console.warn('Lỗi xóa user trên Supabase:', errUser);
                } catch(e) {
                    console.error('Lỗi xóa dữ liệu người dùng trên Supabase:', e);
                    errors.push('Supabase: ' + e.message);
                }
            }

            // 2. Chế độ Google Apps Script (nếu mở trong iframe Apps Script)
            if (window.google && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(res => {
                        showToast(res.message || `Đã xóa vĩnh viễn tài khoản ${targetEmail}!`, '🗑️');
                        loadAdminStats();
                    })
                    .withFailureHandler(err => {
                        showToast('Lỗi xóa trên Google Sheets: ' + err, '❌');
                        loadAdminStats();
                    })
                    .deleteUserData(targetEmail, currentUserEmail);
                return;
            }

            // 3. Chế độ Standalone trên web concavachencom.site: Đồng bộ xóa sang Google Sheet qua doPost
            if (typeof WEB_APP_URL !== 'undefined' && WEB_APP_URL) {
                try {
                    fetch(WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            action: 'deleteUser',
                            targetEmail: targetEmail,
                            adminEmail: currentUserEmail
                        })
                    }).catch(e => console.warn('Lỗi gửi webhook deleteUser sang GAS:', e));
                } catch(e) {}
            }

            if (errors.length === 0) {
                showToast(`Đã xóa vĩnh viễn tài khoản ${targetEmail}! Khi đăng nhập lại sẽ là người dùng mới.`, '🗑️');
            } else {
                showToast(`Đã xóa tài khoản với lưu ý: ${errors.join(', ')}`, '⚠️');
            }

            // Tự động tải lại bảng thống kê Admin
            setTimeout(() => {
                loadAdminStats();
            }, 600);
        }

        async function handleAdminToggleUser(targetEmail, newStatus) {
            return handleAdminDeleteUser(targetEmail);
        }

        async function handleAdminUpdateFeedback(feedbackId, newStatus) {
            if (window.google && google.script && google.script.run) {
                google.script.run
                    .withSuccessHandler(res => {
                        showToast(res.message, '✅');
                        loadAdminStats();
                    })
                    .withFailureHandler(err => showToast('Lỗi: ' + err, '❌'))
                    .updateFeedbackStatus(feedbackId, newStatus, currentUserEmail);
                return;
            }

            if (window.supabaseClient) {
                try {
                    await window.supabaseClient
                        .from('feedbacks')
                        .update({ status: newStatus })
                        .eq('id', feedbackId);
                    showToast('Đã cập nhật trạng thái phản hồi!', '✅');
                    loadAdminStats();
                } catch(e) {
                    showToast('Lỗi cập nhật phản hồi: ' + e.message, '❌');
                }
            }
        }
</script>
